# DOE OE-417 electric disturbance reports by cause, 2014-2023. Written by rr-etl (job `series`); see docs/DATA_SOURCES.md.

id = "oe417"
title = "DOE OE-417 electric disturbance reports by cause, 2014-2023"
publisher = "Pacific Northwest National Laboratory (from DOE OE-417 reports and ORNL EAGLE-I)"
url = "https://data.openei.org/submissions/6458"
licence = "CC BY 4.0"
attribution = "Grid disturbance counts derived by Ready Reckoner from the Event-correlated Outage Dataset in America, Pacific Northwest National Laboratory, OpenEI submission 6458 (CC BY 4.0), which links U.S. Department of Energy Form OE-417 electric emergency and disturbance reports to ORNL EAGLE-I outages."
source = "pnnl_oe417_linkage"
retrieved = "2026-10-01"
how = "fetched"
notes = [
  "2922 distinct OE-417 reports in 2014-2023 (the file's ten yearly event files; the 8- and 24-hour lag variants are not used).",
  "OE-417 reports are filed for large events only (a threshold on load or customers lost, or any physical or cyber attack), the form's type labels changed over the years (grouped here into weather, operations, physical attack or vandalism, suspicious activity, cyber and fuel supply), and reporting grew sharply (32 reports in 2014, 503 in 2020). Rates therefore use 2019-2023 only.",
  "PNNL links reports to EAGLE-I county outages by state and time window, which over-attributes in large states: the number of linked counties is context, not the size of the event.",
]

