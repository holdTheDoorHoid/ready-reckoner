[[rate]]
id = "funding_gap_ge_14d_per_year"
value = 0.08889
unit = "chance a fiscal year has a federal funding gap of 14 full days or more"
low = 0.03036
high = 0.2034
year = 2026
period = "FY1982-FY2026"
figure = "4 of 45 fiscal years (FY1996, FY2014, FY2019, FY2026)"
derivation = "4 / 45; range = exact Poisson 90% interval on 4 events"
note = "Long lapses delay pay for federal workers and contractors and can delay benefits run by the lapsed agencies."
unverified = false

[[rate]]
id = "shutdown_with_furloughs_per_year"
value = 0.1778
unit = "funding gaps with widespread furloughs per year"
low = 0.08846
high = 0.3208
year = 2026
period = "FY1982-FY2026"
figure = "8 gaps with widespread furloughs in 45 fiscal years"
derivation = "8 / 45; range = exact Poisson 90% interval"
note = "Limited furloughs (a half day, a weekend of closed parks, one department) are not counted."
unverified = false

