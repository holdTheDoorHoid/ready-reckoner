# Cell sites out of service after major hurricanes (FCC Disaster Information Reporting System). Written by rr-etl (job `series`); see docs/DATA_SOURCES.md.

id = "fcc_dirs"
title = "Cell sites out of service after major hurricanes (FCC Disaster Information Reporting System)"
publisher = "Federal Communications Commission, Public Safety and Homeland Security Bureau"
url = "https://docs.fcc.gov/public/attachments/DOC-353805A1.pdf"
licence = "US Government work, public domain (17 U.S.C. 105)"
attribution = ""
source = "fcc_dirs_reports"
retrieved = "2026-09-26"
how = "transcribed"
notes = [
  "Daily Communications Status Reports (docs.fcc.gov/public/attachments/<DOC id>.pdf) read from their per-county tables; shares are cell sites out / cell sites served in the reporting area. The FCC widens and later narrows that area, which moves the area-wide share; the worst county counts only counties with 20 or more sites. Site outages include sites down for power or backhaul and do not map one to one onto lost service.",
  "Transcribed by a research agent with pdftotext and a per-county parse, checked against the reports' headline sentence (the FCC's own headline is wrong on Helene 2024-09-28 and 10-01; the tables are used). Not re-read line by line here, so the rates carry unverified = true.",
]

[[rate]]
id = "cell_sites_out_peak_area_share_median"
value = 0.119
unit = "median peak share of cell sites out across a hurricane's reporting area"
low = 0.019
high = 0.956
year = 2024
period = "8 hurricanes, 2017-2024"
figure = "Hurricane Harvey 2017 4.7%; Hurricane Maria 2017, Puerto Rico 95.6%; Hurricane Michael 2018 18.8%; Hurricane Ida 2021 28.1%; Hurricane Ian 2022 10.9%; Hurricane Idalia 2023 1.9%; Hurricane Helene 2024 11.5%; Hurricane Milton 2024 12.3%"
derivation = "median of the events' peak area-wide shares; range = lowest and highest"
note = ""
unverified = true

[[rate]]
