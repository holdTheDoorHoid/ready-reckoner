value = 5.5
unit = "median days from the first report until the area-wide share of cell sites out stayed under 5%"
low = 0
high = 155
year = 2024
period = "8 hurricanes, 2017-2024 (Maria in the Virgin Islands never fell under 5%)"
figure = "Hurricane Harvey 2017 0; Hurricane Maria 2017, Puerto Rico 155; Hurricane Michael 2018 12; Hurricane Ida 2021 8; Hurricane Ian 2022 3; Hurricane Idalia 2023 3; Hurricane Helene 2024 21; Hurricane Milton 2024 3"
derivation = "median over events"
note = "The hardest-hit counties take longer: Buncombe NC 21 days after Helene, San Juan PR about 4 months after Maria."
unverified = true

