period = "8 hurricanes, 2017-2024"
figure = "Calhoun TX 85.2%; 48 of 78 municipios 100.0%; Bay FL 78.3%; Terrebonne LA 100.0%; Glades FL 82.8%; Hamilton FL 59.1%; Tazewell VA 97.7%; Hardee FL 51.2%"
