# FEMA housing assistance after declared disasters, by type of disaster. Written by rr-etl (job `series`); see docs/DATA_SOURCES.md.

id = "ihp_displacement"
title = "FEMA housing assistance after declared disasters, by type of disaster"
publisher = "Federal Emergency Management Agency (OpenFEMA)"
url = "https://www.fema.gov/openfema-data-page/housing-assistance-program-data-renters-v2"
licence = "OpenFEMA Terms and Conditions (public data; citation and statement required)"
attribution = "This product uses the Federal Emergency Management Agency’s OpenFEMA API, but is not endorsed by FEMA. The Federal Government or FEMA cannot vouch for the data or analyses derived from these data after the data have been retrieved from the Agency's website(s)."
source = "openfema_housing_assistance"
retrieved = "2026-09-26"
how = "fetched"
notes = [
  "HousingAssistanceRenters (147957 rows) and HousingAssistanceOwners (160368 rows) v2, per disaster and ZIP code, joined to DisasterDeclarationsSummaries by disaster number for the incident type; 651 rows had no declaration.",
  "The damage columns of both v2 files (renters' moderate, major and substantial damage; owners' FEMA-inspected damage buckets; totalInspected) are zero in every row (checked 2026-09-26 by asking the API for rows above zero: none), so no damage share is published; registrations, approvals and rental assistance are filled.",
  "Counts registrations with FEMA, not all households hit: people who did not apply, or whose insurance covered them, are not in the data. Rental assistance is what FEMA paid to help people live elsewhere, a floor on the cost of being displaced.",
  "See also https://www.fema.gov/openfema-data-page/housing-assistance-program-data-owners-v2 and https://www.fema.gov/openfema-data-page/disaster-declarations-summaries-v2. Months displaced by hazard is not built: only 3% of rental-eligible registrations carry an end date.",
]

