# Documents and money: the Emergency Financial First Aid Kit, insurance, cash and savings.
# Rules: docs/CONTENT_STANDARDS.md §3. Money buckets are funded on the savings track, not the supplies
# budget (DESIGN §4.7); these items are the free actions and small purchases around them, and the
# decisions (`decision = true`: insurance, ID, home repairs to weigh), which cost the budget nothing.

[[item]]
id = "docs_effak"
name = "Documents and insurance: copy key papers, record belongings, check cover"
category = "documents_money"
unit = "action"
buckets = ["home_loss", "evacuate", "income"]
tier = "now"
free = true
spec = "Use FEMA's Emergency Financial First Aid Kit to gather IDs, financial and legal papers, insurance, medical information and contacts, and photograph or video every room and valuable item. Keep paper copies in a waterproof bag and another copy with someone you trust or in secure online storage (FEMA). Check what your insurance covers: standard home and renters policies do not cover flood or earthquake damage, a new flood policy usually takes 30 days to start, and renters can buy their own policy and contents-only flood cover (Ready.gov, FEMA)."
look_for = [
  "IDs, certified copies of birth certificates, lease or deed, insurance policies and bank details",
  "A passport book or card for each person, children included",
  "Copies of your will, advance directive and powers of attorney for health care and for money",
  "Medicine lists, medical records and pet records",
  "Scans in an encrypted password vault, one folder of key files backed up away from home, and account backup codes on paper",
  "A walk-through video of every room, closets included, with a copy stored away from the house",
  "Flood cover if you are near water, and additional living expenses cover for a place to stay",
  "Renters: a renters-insurance quote with contents, living expenses and liability cover",
]
avoid = [
  "Keeping the only copies at home",
  "Waiting for a storm forecast to buy flood insurance",
  "Assuming your landlord's policy covers your belongings",
  "Letting the kit go out of date: update it at tax time or on a birthday",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: copies, photos and a call to your insurer." }
quantity_rule = "once"
maintenance = { check_months = 12 }
citations = ["fema_effak", "ready_gov_financial", "ready_gov_kit", "ready_gov_floods", "ready_gov_earthquakes", "fema_nfip_flood_insurance", "floodsmart_buy_policy", "fema_nhs_2024", "state_dept_passport_card", "state_dept_child_passport", "nia_affairs_checklist", "ready_gov_cybersecurity", "cisa_data_backup_2012", "ollam_2022_lawyer_passport_locksmith_gun"]
hazard_extras = []
readiness_share = 0.3

[[item]]
id = "docs_start_emergency_fund"
name = "Money: start an emergency fund and a bare-bones budget"
category = "documents_money"
unit = "action"
buckets = ["income"]
tier = "now"
free = true
spec = "Set up an automatic transfer, however small, into a savings account you keep for emergencies; the CFPB says the right amount depends on your situation, and planners often suggest working toward three to six months of expenses (FINRA). Write down your essential monthly costs and what you would cut first, so you know how far savings would stretch. If anyone earns, find your state's unemployment website now, so you could file right away if a job ends (Department of Labor)."
look_for = [
  "An automatic transfer on payday into a separate account",
  "Part of any tax refund or windfall",
  "Rent, utilities, food, medicine, insurance and debt minimums listed",
  "Your state unemployment office's website saved, with recent pay stubs and employer details",
]
avoid = [
  "Waiting until you can save a lot",
  "Putting emergency money where it is hard to reach quickly",
  "Waiting weeks to file for unemployment",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free to start: the fund itself is savings, tracked separately from supplies." }
quantity_rule = "once"
citations = ["cfpb_emergency_fund", "finra_financial_foundations", "stlouisfed_emergency_fund_2025", "fed_shed_2024", "dol_unemployment_insurance", "bls_work_experience_2024"]
hazard_extras = []

