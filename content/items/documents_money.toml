[[item]]
id = "decide_home_insurance"
name = "Decide: homeowners, condo or renters insurance"
category = "documents_money"
unit = "decision"
buckets = ["home_loss"]
tier = "now"
free = true
decision = true
spec = "A home, condominium or renters policy pays to repair or replace what a fire, storm or theft destroys, and most pay for somewhere to stay while the home is fixed (NAIC). If you have none, get a quote and decide; a renters policy covers your belongings and liability, not the building (Ready.gov)."
look_for = [
  "Replacement cost for belongings, not only their used value",
  "Additional living expenses, for a place to stay",
  "Liability cover",
  "Photos or a video of each room, kept away from home",
]
avoid = [
  "Assuming a landlord's policy covers your belongings",
  "Letting a policy lapse to save money in a tight month",
]
price_band_usd = { low = 0, high = 0, per = "decision", note = "A decision, not a purchase from the supplies budget. Premiums depend on the home and the place, so ask for a quote." }
quantity_rule = "insurance_home_or_renters"
citations = ["naic_home_insurance_guide", "ready_gov_financial", "fema_effak"]
hazard_extras = []

[[item]]
id = "decide_flood_insurance"
name = "Decide: flood insurance, even outside a flood zone"
category = "documents_money"
unit = "decision"
buckets = ["home_loss"]
tier = "now"
free = true
decision = true
spec = "Home and renters policies do not cover floods, and about 3 in 10 flood insurance claims come from outside high-risk flood areas (FloodSmart). A quote costs nothing, and a new flood policy usually starts 30 days after you buy it, so decide before storm season (FEMA)."
look_for = [
  "Your flood zone, and a quote from your insurance agent",
  "Cover for belongings, which renters can buy on its own",
  "The 30-day wait counted before hurricane or snowmelt season",
]
avoid = [
  "Waiting for a forecast to buy it",
  "Assuming you are safe because you live outside the mapped zone",
]
price_band_usd = { low = 0, high = 0, per = "decision", note = "A decision, not a purchase from the supplies budget. Premiums depend on the home and its flood risk, so ask for a quote." }
quantity_rule = "insurance_flood"
citations = ["floodsmart_flood_risk", "fema_nfip_flood_insurance", "floodsmart_buy_policy", "ready_gov_floods"]
hazard_extras = []

