# Community is a supply (docs/PRINCIPLES.md §6): neighbours, check-ins and local groups carry real
# risk-reduction weight in the allocator. Rules: docs/CONTENT_STANDARDS.md §3.

[[item]]
id = "community_know_two_neighbours"
name = "Neighbours and skills: swap numbers, check on each other, learn first aid"
category = "community"
unit = "action"
buckets = ["security", "medical_emergency", "thermal", "evacuate", "supplies", "fire"]
tier = "now"
free = true
spec = "Swap phone numbers with at least two neighbours, agree who checks on whom in heat waves, storms and outages, and make a simple street contact list with the neighbours who agree. After the 2011 Japan tsunami, places with stronger social ties had fewer deaths, and in the 1995 Chicago heat wave living alone raised the risk of dying. Take a first-aid, bleeding-control and hands-only CPR class, or free CERT training, so you can help until responders arrive (Ready.gov)."
look_for = [
  "Two neighbours' numbers in your phone and on your contact card",
  "A daily check-in by phone or at the door in extreme heat or cold, especially for people who live alone",
  "A street list with only what each neighbour agrees to share, updated each year",
  "A free Stop the Bleed class, and a first-aid and CPR class from a hospital, fire department or the Red Cross",
  "Your local CERT program or a neighbourhood group",
]
avoid = [
  "Waiting for a disaster to meet the people next door",
  "Posting the street list online, or sharing someone's medical details without permission",
  "Self-deploying into danger: CERT training teaches when to stop",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: introductions, a shared list and free classes." }
quantity_rule = "once"
maintenance = { check_months = 12 }
citations = ["aldrich_sawada_2015", "ye_aldrich_2019", "fema_nhs_2024", "semenza_1996_heat_deaths", "ready_gov_older_adults", "cdc_heat_health", "listos_california", "ready_gov_cert", "dhs_stop_the_bleed", "gargano_2017_wtc_training", "redcross_first_aid_kit"]
hazard_extras = []
