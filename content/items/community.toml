# Community is a supply (docs/PRINCIPLES.md §6): neighbours, check-ins and local groups carry real
# risk-reduction weight in the allocator. Rules: docs/CONTENT_STANDARDS.md §3.

[[item]]
id = "community_know_two_neighbours"
name = "Get to know two neighbours and swap phone numbers"
category = "community"
unit = "action"
buckets = ["security", "medical_emergency", "thermal", "evacuate", "supplies"]
tier = "now"
free = true
spec = "Introduce yourself to at least two neighbours and save each other's numbers. After the 2011 Japan tsunami, places with stronger social ties had fewer deaths, especially among older and low-income people. About 7 in 10 people expect help from friends and family first (FEMA's 2024 survey)."
look_for = [
  "Two neighbours on your street or in your building",
  "Their numbers in your phone and on your contact card",
  "Who has medical needs, pets or no car",
]
avoid = [
  "Waiting for a disaster to meet the people next door",
  "Assuming someone else on the street will check in",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a knock on the door." }
quantity_rule = "once"
citations = ["aldrich_sawada_2015", "ye_aldrich_2019", "fema_nhs_2024"]
hazard_extras = []

[[item]]
id = "community_check_in_agreement"
name = "Agree who checks on whom"
category = "community"
unit = "action"
buckets = ["thermal", "medical_emergency", "security"]
tier = "now"
free = true
spec = "Agree with neighbours or relatives who checks on whom during heat waves, storms and outages, especially older people who live alone. In the 1995 Chicago heat wave, living alone and not leaving home each day made death far more likely, and regular social contact was protective."
look_for = [
  "A daily check-in by phone or at the door in extreme heat or cold",
  "Someone who can check on you if you live alone",
  "A spare key with a trusted neighbour",
]
avoid = [
  "Assuming a quiet neighbour is fine",
  "Checking once and not again",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: one conversation." }
quantity_rule = "once"
citations = ["semenza_1996_heat_deaths", "ready_gov_older_adults", "cdc_heat_health"]
hazard_extras = []

[[item]]
id = "community_block_group_cert"
name = "Join or start a block group, or take CERT training"
category = "community"
unit = "action"
buckets = ["medical_emergency", "fire", "security", "evacuate"]
tier = "now"
free = true
spec = "Join a neighbourhood preparedness group or take free Community Emergency Response Team (CERT) training, which teaches fire safety, light search and rescue, team organization and disaster first aid (Ready.gov). Trained neighbours can help until responders arrive."
look_for = [
  "Your local CERT program or neighbourhood association",
  "A block party or group chat to start one",
  "A shared list of skills and tools on your street",
]
avoid = [
  "Self-deploying into danger: CERT training teaches when to stop",
  "Groups that spread rumours instead of official information",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "CERT training is free through local programs." }
quantity_rule = "once"
citations = ["ready_gov_cert", "listos_california", "gargano_2017_wtc_training"]
hazard_extras = []

[[item]]
id = "community_street_list"
name = "Make a simple street contact list"
category = "community"
unit = "action"
buckets = ["security", "medical_emergency", "evacuate"]
tier = "now"
free = true
spec = "With willing neighbours, list names, phone numbers and anything useful in an emergency: who needs help to evacuate, who has a generator or medical skills, and who has pets. State programs such as Listos California offer templates for exactly this."
look_for = [
  "Only what each neighbour agrees to share",
  "A paper copy for each household on the list",
  "An update each year",
]
avoid = [
  "Posting the list online",
  "Sharing someone's medical details without permission",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: paper and a few conversations." }
quantity_rule = "once"
maintenance = { check_months = 12 }
citations = ["listos_california", "ready_gov_older_adults"]
hazard_extras = []
