[[item]]
id = "water_heater_reserve"
name = "Know how to use the water in your water heater"
category = "water"
unit = "action"
buckets = ["water_out"]
tier = "now"
free = true
life_safety = true
spec = "A tank water heater holds 20 to 80 gallons of clean tap water, and CDC lists it as a safe source when the taps are off. Learn where its drain valve and your home's main water shut-off are, so you can keep unsafe water out and drain the tank when you need it."
look_for = [
  "The tank size printed on the heater's label",
  "The drain valve at the bottom of the tank, and a hose or pan that fits under it",
  "Your home's main water shut-off valve",
]
avoid = [
  "Water from a boiler or radiator system: CDC says use the tap water heater, not the heating tank",
  "Draining the tank while its power or gas is still on",
  "Letting unsafe city water flow in: officials may tell you to shut the main valve",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: it uses water you already have." }
quantity_rule = "once"
citations = ["doe_water_heaters", "cdc_find_clean_water"]
hazard_extras = []

[[item]]
id = "water_boil_method"
name = "Know how to boil water safely"
category = "water"
unit = "action"
buckets = ["water_boil"]
tier = "now"
free = true
spec = "Bring clear water to a rolling boil for 1 minute, or 3 minutes above 5,000 feet, then let it cool before storing it (EPA, CDC). Let cloudy water settle or strain it through a clean cloth first."
look_for = [
  "A pot with a lid that you keep for boiling",
  "A safe indoor heat source: an electric stove when power is on, or a gas stove you know how to light with a match",
  "Clean containers with lids for the cooled water",
]
avoid = [
  "Camp stoves, grills or generators indoors (carbon monoxide)",
  "Boiling water that smells of fuel or chemicals: boiling does not make it safe (CDC)",
  "Pitcher or fridge filters during a boil notice: boil filtered tap water too (CDC)",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: it uses a pot and stove you already have." }
quantity_rule = "once"
citations = ["epa_emergency_disinfection", "cdc_water_disinfection", "cdc_water_advisories", "cdc_co_basics"]
hazard_extras = []

