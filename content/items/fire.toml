[[item]]
id = "fire_extinguisher"
name = "Multipurpose fire extinguisher"
category = "fire"
unit = "extinguisher"
buckets = ["fire"]
tier = "h72"
free = false
life_safety = true
spec = "A multipurpose extinguisher labeled A-B-C, which works on most home fires (USFA). The plan counts one for each floor you live on, an estimate, with one near the kitchen, where most small home fires start (CPSC). Use it only on a small fire with a clear way out: pull the pin, aim at the base, squeeze and sweep."
look_for = [
  "An A-B-C rating and a testing-lab listing",
  "A size you can lift and aim: 2.5 to 5 pounds",
  "A mounting bracket by the kitchen door",
]
avoid = [
  "Fighting a fire that is spreading: get out and call 911",
  "Extinguishers with the gauge needle out of the green",
]
price_band_usd = { low = 22.49, high = 44.47, per = "extinguisher", note = "Two home-center listings for 2.5-pound A-B-C extinguishers: $22.49 each in a two-pack, or $44.47 for a rechargeable one." }
retrieved = "2026-09-26"
quantity_rule = "extinguisher_count"
maintenance = { check_months = 1 }
