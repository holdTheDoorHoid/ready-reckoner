category = "fire"
unit = "action"
buckets = ["fire", "water_out", "medical_emergency"]
tier = "now"
free = true
spec = "Strap the water heater and anchor bookcases, refrigerators, televisions and wall hangings, and store heavy or breakable things on low shelves (Ready.gov). A strapped tank stays a store of clean water; a fallen one can break a gas line."
