[[item]]
id = "fire_escape_plan"
name = "Make a home fire escape plan with two ways out"
category = "fire"
unit = "action"
buckets = ["fire", "evacuate"]
tier = "now"
free = true
life_safety = true
spec = "Find two ways out of every room, pick a meeting spot outside, and practice twice a year, including feeling your way out in the dark (Ready.gov). Fire can make a home dark and deadly in minutes."
look_for = [
  "Windows that open and screens that come out quickly",
  "A meeting spot in front of the home, such as a mailbox",
  "Children who know not to hide from firefighters",
]
avoid = [
  "Going back inside for belongings or pets",
  "Security bars without a quick-release",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a floor plan and practice." }
quantity_rule = "once"
maintenance = { check_months = 6 }
citations = ["ready_gov_home_fires", "usfa_smoke_alarms"]
hazard_extras = []

[[item]]
id = "fire_kitchen_safety"
name = "Stay with your cooking and keep a lid nearby"
category = "fire"
unit = "action"
buckets = ["fire"]
tier = "now"
free = true
spec = "Cooking is by far the leading cause of home fires (USFA). Stay in the kitchen while frying or broiling, and keep a pan lid or baking sheet nearby to cover a pan fire."
look_for = [
  "A lid within reach of the stove",
  "Pot handles turned toward the back",
  "Towels, mitts and packaging kept away from burners",
]
avoid = [
  "Throwing water on a grease fire",
  "Leaving the kitchen with a burner on",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: habits." }
quantity_rule = "once"
citations = ["usfa_cooking_fires"]
hazard_extras = []

[[item]]
id = "fire_heating_safety"
name = "Heat safely: space heaters 3 feet from anything that burns"
category = "fire"
unit = "action"
buckets = ["fire", "thermal"]
tier = "now"
free = true
spec = "Keep anything that can burn at least 3 feet from heaters, fireplaces and stoves, turn space heaters off when you leave the room or go to bed, and have chimneys and heating equipment checked each year (USFA). Never heat the home with an oven."
look_for = [
  "Space heaters with automatic shut-off (CDC)",
  "A clear 3-foot zone around every heater",
  "A yearly chimney and furnace check",
]
avoid = [
  "Extension cords for space heaters",
  "Grills, camp stoves or generators indoors for heat (carbon monoxide)",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: habits; a chimney check costs extra." }
quantity_rule = "once"
citations = ["usfa_heating_fires", "cdc_winter_safety", "cdc_co_basics"]
hazard_extras = []

[[item]]
id = "fire_learn_shutoffs"
