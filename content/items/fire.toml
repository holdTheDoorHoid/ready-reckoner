[[item]]
id = "fire_clean_room_plan"
name = "Clean-room plan for smoky, dusty or chemical air"
category = "fire"
unit = "plan"
buckets = ["clean_air"]
tier = "now"
free = true
spec = "Pick one room with few windows and doors where everyone can sleep; on bad-air days keep it closed, run the air cleaner there, and set the heating or cooling to recirculate or turn off fans that pull in outside air (EPA). Children stay in the clean room, because respirators are not made to fit them (EPA)."
look_for = [
  "The room chosen, with the air cleaner or filter box kept in it",
  "Windows and doors that close tightly, and a way to cover gaps",
  "No frying, candles, smoking or vacuuming on bad-air days",
  "Air quality alerts for your area turned on",
  "Chemical release: seal the room's windows and vents with plastic sheeting and tape, and turn off the heating and cooling (Ready.gov)",
]
avoid = [
  "Opening windows while smoke or dust is outside",
  "A whole-house fan or an air conditioner that pulls in outdoor air",
]
