# House fire, carbon monoxide, utilities, clean air indoors and covering damage. Rules: docs/CONTENT_STANDARDS.md §3.
# Prices: docs/PRICE_OBSERVATIONS.md (observed 2026-09-25).

[[item]]
id = "fire_test_alarms"
name = "Fire safety at home: alarms, an escape plan, safe cooking and heating"
category = "fire"
unit = "action"
buckets = ["fire", "evacuate"]
tier = "now"
free = true
life_safety = true
spec = "Test every smoke and carbon monoxide alarm once a month (USFA), and make an escape plan with two ways out of every room and a meeting spot outside, practiced twice a year (Ready.gov). Cooking is by far the leading cause of home fires, so stay with your cooking and keep a lid nearby (USFA). Keep anything that can burn 3 feet from heaters, and never heat the home with an oven (USFA)."
look_for = [
  "A monthly alarm test, for example on the first of the month",
  "No working smoke alarms? Renters ask the landlord first; anyone can ask the fire department or the Red Cross to install free ones",
  "Smoke alarms replaced 10 years after they were made, and carbon monoxide alarms as the maker says or every 5 years",
  "Two ways out of every room, windows that open, and a meeting spot in front of the home",
  "A pan lid or baking sheet within reach of the stove",
  "Space heaters with automatic shut-off, turned off when you leave the room or go to bed",
  "Wood, oil, gas or propane heat: the heater, chimney and vents inspected and cleaned by a professional each year (EPA, USFA)",
  "Children who know not to hide from firefighters",
]
avoid = [
  "Taking the battery out to stop cooking alarms",
  "Going back inside for belongings",
  "Leaving the kitchen with a burner on",
  "Grills, camp stoves or generators indoors for heat (carbon monoxide)",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: monthly checks and a plan." }
quantity_rule = "once"
maintenance = { check_months = 1 }
citations = ["usfa_smoke_alarms", "redcross_sound_the_alarm", "cdc_co_basics", "ready_gov_home_fires", "usfa_cooking_fires", "usfa_heating_fires", "cdc_winter_safety", "epa_burnwise_faq"]
hazard_extras = []
readiness_share = 1.0

[[item]]
id = "fire_learn_shutoffs"
name = "Know and prepare your home: shut-offs, pipes, straps and the outside"
category = "fire"
unit = "action"
buckets = ["fire", "water_out", "home_loss"]
tier = "now"
free = true
spec = "Find your main water valve, gas meter valve and electrical panel, learn how each works, and keep a wrench or pliers by them (Ready.gov). Before winter, learn how to keep pipes from freezing; in earthquake country, strap the water heater and anchor tall furniture (Ready.gov). If you live in a house in wildfire or hurricane country, clear a fire-resistant zone at least 30 feet around it, or plan how you will protect windows, before the season starts (Ready.gov)."
look_for = [
  "Labels on the main breaker and water valve, and everyone old enough knowing where they are",
  "Pipes in unheated spaces insulated, and a tool to shut the main water valve",
  "A water heater strap kit and anti-tip straps for tall furniture",
  "Propane heat: how to close the tank valve, and what to do if you smell gas (leave, then call the gas company from outside)",
  "Wildfire areas: clean gutters and nothing that burns within 30 feet of the walls",
  "Hurricane areas: window sizes measured, and shutters or boards stored where you can reach them",
]
avoid = [
  "Turning gas back on yourself after it was shut off: call the gas company",
  "Thawing pipes with an open flame",
  "Renters drilling without asking: ask the landlord, who may do it",
  "Waiting for a warning to buy materials",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: learning your home, plus straps or materials you may already have." }
quantity_rule = "once"
citations = ["ready_gov_kit", "cdc_find_clean_water", "ready_gov_earthquakes", "ready_gov_winter", "doe_water_heaters", "ready_gov_wildfires", "ready_gov_hurricanes", "pa_puc_gas_emergencies", "ready_gov_safety_skills"]
hazard_extras = []
readiness_share = 0.3

[[item]]
id = "fire_smoke_alarm"
name = "Smoke alarms inside and outside sleeping areas"
category = "fire"
unit = "alarm"
buckets = ["fire"]
tier = "h72"
free = false
life_safety = true
spec = "Smoke alarms inside and outside each bedroom and sleeping area and on every level of the home (USFA). Ask first: some fire departments and the Red Cross install free smoke alarms, and renters should ask the landlord, so buy them only if that fails (USFA, Red Cross). Interconnected alarms, which all sound together, give more warning."
look_for = [
  "A free installation visit from your fire department or the Red Cross, or your landlord's",
  "A listing mark from a testing lab on the package",
  "Sealed 10-year batteries, or plan to change batteries yearly",
  "Alarms with strobes or bed shakers for anyone who is deaf or hard of hearing",
]
avoid = [
  "Alarms right next to the stove or bathroom, which cause false alarms",
  "Alarms more than 10 years old",
]
price_band_usd = { low = 18.97, high = 32.47, per = "alarm", note = "Two home-center listings: an AA-battery photoelectric alarm at $18.97 and a 10-year sealed-battery alarm at $32.47." }
