category = "fire"
unit = "action"
buckets = ["fire", "water_out"]
tier = "now"
free = true
spec = "Find your home's main water valve, gas meter valve and electrical panel, and learn how each one works; Ready.gov's basic kit includes a wrench or pliers to turn off utilities. Officials may tell you to shut the water main to keep unsafe water out (CDC)."
look_for = [
  "Labels on the main breaker and water valve",
  "A wrench or pliers kept by the gas meter and water valve",
  "Everyone old enough knowing where they are",
]
avoid = [
  "Trying a stiff valve for the first time in the dark",
  "Turning gas back on yourself after it was shut off: call the gas company",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a walk around the house." }
quantity_rule = "once"
