  "A water heater strap kit sized for your tank",
  "Anti-tip straps for tall furniture",
  "Heavy objects moved to low shelves",
]
avoid = [
  "Tall furniture over beds",
  "Renters drilling without asking: ask the landlord, who may do it",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free to plan and rearrange; strap kits cost extra at a hardware store." }
