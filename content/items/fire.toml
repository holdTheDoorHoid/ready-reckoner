name = "Test smoke and carbon monoxide alarms every month"
category = "fire"
unit = "action"
buckets = ["fire"]
tier = "now"
free = true
life_safety = true
spec = "Press the test button on every smoke and carbon monoxide alarm once a month (USFA). Replace smoke alarms 10 years after they were made, and carbon monoxide alarms as the maker says or every 5 years (CDC)."
look_for = [
  "A monthly reminder, such as the first of the month",
  "The date printed on the back of each alarm",
  "Batteries replaced yearly in alarms that use 9-volt batteries",
]
avoid = [
  "Taking the battery out to stop cooking alarms",
  "Painting over or covering an alarm",
]
