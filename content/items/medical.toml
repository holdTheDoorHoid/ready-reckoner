[[item]]
id = "med_antibiotics_clinician_card"
name = "Antibiotics: talk with your own clinician (no stockpile)"
category = "medical"
unit = "action"
buckets = ["medication", "medical_emergency"]
tier = "now"
free = true
spec = "The plan never sets an antibiotic quantity: antibiotics are prescription-only, and CDC advises against saving them for later. If a specific, foreseeable situation worries you, such as remote travel or a known recurring condition, ask your own clinician whether a standby prescription with written instructions makes sense."
look_for = [
  "A clinician who knows your history, in person or by telehealth",
  "Written instructions for any standby prescription: when to start it and when to call",
  "Storage as the label says, and a note of the expiry date",
]
avoid = [
  "Aquarium, fish or veterinary antibiotics: the FDA calls these unapproved and unsafe for people",
  "Sharing antibiotics, or taking someone else's (CDC)",
  "Expired antibiotics, which can fail to treat an infection (FDA)",
  "Starting antibiotics on your own when medical care can be reached",
  "Mail-order kits prescribed without a diagnosis ($300–400): infection specialists warn they fuel resistance",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a conversation with your clinician. The plan buys no antibiotics." }
quantity_rule = "once"
citations = ["cdc_antibiotic_use", "usc_21_353", "cdc_yellow_book_travel_kits", "fda_fish_antibiotics_warning_2023", "bishop_2020_fish_antibiotics", "fda_expired_medicines", "mo_med_2026_antibiotic_kits", "wms_wound_2014"]
