[[item]]
id = "med_988_saved"
name = "Mental health: save 988 and the distress helpline, and write a calm plan"
category = "medical"
unit = "action"
buckets = ["medical_emergency"]
tier = "now"
free = true
spec = "Save 988, the Suicide and Crisis Lifeline, and the Disaster Distress Helpline (call or text 1-800-985-5990) in every phone and on the paper contact card; both are free and answer day and night (SAMHSA). Write down what each person might feel after a disaster, what helps each of you settle, and who you will call. A plan made on a calm day makes it easier to ask for help."
look_for = [
  "Both numbers saved in every phone and on the contact card",
  "Children and teens told they can call or text too",
  "One or two things that help each person settle, such as a walk, music, prayer or a routine",
  "Who each person can talk to",
]
avoid = [
  "Waiting until things feel unbearable to reach out",
  "Expecting everyone to feel fine right away",
  "Shutting down children's questions",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: both lines cost nothing to call or text." }
quantity_rule = "once"
citations = ["samhsa_988", "samhsa_disaster_distress", "rr_research_prior_art"]
hazard_extras = []

