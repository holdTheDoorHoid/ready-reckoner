# Medical: medicine continuity, first aid and mental health. Rules: docs/CONTENT_STANDARDS.md §3, §5.
# The validator rejects dosing patterns in this file and allows aquarium, fish or veterinary
# antibiotics to be named only in `avoid`, as a warning. No drug names with doses, anywhere.

[[item]]
id = "med_list_written"
name = "Keep medicines going: a written list, early refills, an emergency supply"
category = "medical"
unit = "action"
buckets = ["medication", "medical_emergency"]
tier = "now"
free = true
life_safety = true
spec = "Write a paper list of each person's medicines with the dose their prescriber set, allergies, and the prescriber's and pharmacy's numbers, and keep copies in the go-bag and with your documents (Ready.gov). If anyone takes a daily medicine, refill when a week is left and ask the prescriber and pharmacist how to build an emergency supply; some states allow emergency refills, and a federal program can help people without insurance after a disaster. Set up telehealth and pharmacy logins now, and put spare glasses in the go-bag (Ready.gov)."
look_for = [
  "Every medicine on the list, including over-the-counter ones and supplements",
  "Pharmacy refill reminders, and a 90-day supply where your plan and prescriber allow it",
  "Your state's emergency refill rule (your pharmacist will know it), and a second pharmacy",
  "Telehealth and pharmacy logins with your insurance member number, kept somewhere besides your phone",
  "An old pair of glasses and lens solution in the go-bag",
]
avoid = [
  "Waiting for the last pill",
  "Changing or stretching a medicine on your own: call your prescriber or pharmacist",
  "Keeping the only copy of the list on your phone",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a list, reminders and phone calls." }
quantity_rule = "once"
maintenance = { check_months = 6 }
citations = ["ready_gov_disability", "fema_effak", "cdc_pregnancy_emergency", "redcross_survival_kit", "fda_expired_medicines", "healthcare_ready_refill_laws", "hhs_aspr_epap", "mo_med_2026_antibiotic_kits", "ready_gov_kit"]
hazard_extras = []

[[item]]
id = "med_reserve_supply"
name = "Extra supply of daily prescription medicine (toward 14 days)"
category = "medical"
unit = "day of one person's medicine"
buckets = ["medication"]
tier = "h72"
free = false
life_safety = true
spec = "Build a cushion of each daily prescription toward 14 days on hand, between CDC's 7 to 10 days and Florida's two weeks. Keep medicines in their labeled bottles in a cool, dry place and use the oldest first."
look_for = [
  "Pharmacy labels on every bottle",
  "Expiry dates past your next refill",
  "The supplies that go with a medicine, such as test strips or syringes",
]
avoid = [
  "Expired medicine, which may not work (FDA)",
  "A hot car or a steamy bathroom (FDA)",
  "Pill organizers as the only storage: they hide names and dates",
]
price_band_usd = { low = 0.40, high = 1.33, per = "day of one person's medicine", note = "Average 2025 employer-plan copays of $12 for a generic and $40 for a preferred brand-name drug per 30-day fill, or $0.40–1.33 a day. Your own copay replaces this." }
retrieved = "2026-09-25"
quantity_rule = "medication_days"
maintenance = { rotate_months = 1 }
citations = ["cdc_pregnancy_emergency", "redcross_survival_kit", "florida_dem_medication", "cdc_diabetes_emergencies", "fda_expired_medicines", "kff_ehbs_2025", "rr_price_observations_2026_09"]
