spec = "Anyone prescribed an epinephrine auto-injector should always carry two, because one dose may not be enough (FDA-approved patient information). Check the expiry dates, replace a used one right away, and show family, caregivers and teachers where they are and how to use them. Ask the prescriber how many to keep at home, at school and in the go-bag."
