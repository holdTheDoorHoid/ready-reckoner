[[item]]
id = "med_cooler_refrigerated_rx"
name = "Insulated bag and cold packs for refrigerated medicine"
category = "medical"
unit = "set"
buckets = ["medication", "power"]
tier = "h72"
free = false
life_safety = true
spec = "An insulated bag with cold packs keeps medicine such as insulin in the shade and below 86°F, never frozen, for about a day when the power is out or you leave home. Insulin in its vial or pen keeps working for up to 28 days between 59°F and 86°F (FDA, CDC); for any other medicine that must stay cold, ask your pharmacist how long it keeps out of the fridge. Pack diabetes supplies with it for 1 to 2 weeks: a glucose meter with test strips and lancets, syringes or pen needles, glucose tablets or another quick sugar, ketone strips and spare batteries (CDC)."
look_for = [
  "A bag that fits your medicine and two cold packs, with a cloth between them",
  "A small thermometer or temperature strip, to check it stays below 86°F",
  "Your pharmacist's answer on how long each medicine keeps out of the fridge, written on your medicine list",
  "Diabetes supplies for 1 to 2 weeks packed with it, if anyone has diabetes (CDC)",
]
avoid = [
  "Medicine pressed directly against ice or frozen packs, which can freeze it",
  "A hot car or direct sun",
  "Insulin that has frozen: do not use it (FDA)",
  "Counting on the bag alone for a power cut of more than a day or two",
]
price_band_usd = { low = 14.74, high = 36.73, per = "set", note = "Two combinations of retail listings: a small insulated bag ($12.99) or a soft cooler ($34.99), each with two gel packs at $0.87." }
retrieved = "2026-09-25"
quantity_rule = "once_if_refrigerated_rx"
citations = ["fda_insulin_emergency", "cdc_insulin_emergency", "cdc_diabetes_emergencies", "rr_expert_prior", "rr_price_observations_2026_09"]
hazard_extras = []

