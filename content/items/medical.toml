[[item]]
id = "med_epinephrine_plan"
name = "Epinephrine: carry two auto-injectors and keep them in date"
category = "medical"
unit = "person"
buckets = ["medication", "medical_emergency"]
tier = "now"
free = true
life_safety = true
spec = "Anyone prescribed an epinephrine auto-injector should always carry two, because one dose may not be enough and a device set off by accident cannot be used (FDA-approved patient information). Check the expiry dates, replace a used one right away, and show family, caregivers and teachers where they are and how to use them. Ask the prescriber how many to keep at home, at school and in the go-bag."
look_for = [
  "Two auto-injectors with the person at all times, and a refill ordered before they expire",
  "A calendar reminder a month before the expiry date",
  "Family, caregivers and teachers who know where they are kept and how to use them",
]
avoid = [
  "Leaving the auto-injectors in a hot car or at home",
  "Waiting once a severe reaction starts: follow the prescriber's plan and call 911",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a habit and a talk with the prescriber; the auto-injectors themselves are a prescription." }
quantity_rule = "epinephrine_check"
citations = ["dailymed_epinephrine_autoinjector", "ready_gov_disability"]
hazard_extras = []
