[[item]]
id = "san_cover_material"
name = "Collect cover material for the toilet"
category = "sanitation"
unit = "action"
buckets = ["water_out"]
tier = "now"
free = true
spec = "Keep a bag of dry, carbon-rich cover material for the toilet bucket, such as sawdust, shredded paper, dry leaves or pet bedding. A handful after each use controls smell and helps waste dry out (RDPO)."
look_for = [
  "Shredded paper or cardboard from your own recycling",
  "Sawdust or pet bedding (not cedar)",
  "A dry, covered bin to keep it in",
]
avoid = [
  "Wet material, which does not control smell",
  "Cedar chips",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free if you use shredded paper or leaves; pet bedding costs a few dollars a bag." }
quantity_rule = "once"
citations = ["rdpo_emergency_toilet"]
hazard_extras = []

