category = "special_needs"
unit = "action"
buckets = ["evacuate", "medical_emergency", "power"]
tier = "now"
free = true
spec = "Build a support network who know your needs, can reach you and know how to operate your equipment, and plan how you would evacuate with it (Ready.gov). Keep a spare battery for a power wheelchair or other assistive device if you can, and ask local groups for help buying one if you cannot."
look_for = [
  "Two or more people who will check on you and can move your equipment",
  "Printed communication cards if speech or hearing is affected",
  "A second dialysis center or treatment clinic, if you use one",
]
avoid = [
  "A plan that depends on one helper",
  "Evacuation transport that cannot take your wheelchair or service animal",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free to plan; spare batteries cost extra." }
quantity_rule = "once_if_mobility_needs"
citations = ["ready_gov_disability", "ready_gov_older_adults"]
hazard_extras = []

[[item]]
id = "special_older_adult_plan"
name = "Plan for older adults in the household"
category = "special_needs"
unit = "action"
buckets = ["evacuate", "thermal", "medical_emergency", "income"]
tier = "now"
free = true
spec = "Plan transport if help is needed to evacuate, copy Medicare and Medicaid cards, give someone in your support network a key and show them your equipment, and ask any clinic you rely on about its emergency plans (Ready.gov). Heat and cold are harder on people over 65, so set up daily check-ins in extreme weather."
look_for = [
  "Copies of Medicare, Medicaid and insurance cards",
  "Someone with a key who knows where supplies are kept",
  "Federal benefits by direct deposit or the Direct Express card, since disasters can delay mail",
  "A cooling and warming plan with daily check-ins",
]
avoid = [
  "Planning to drive yourself if you rarely drive now",
  "Keeping medicines and supplies in more than one hard-to-find place",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: conversations and copies." }
quantity_rule = "once_if_senior"
citations = ["ready_gov_older_adults", "cdc_heat_health", "cdc_winter_safety"]
hazard_extras = []

[[item]]
