[[item]]
id = "special_infant_go_kit"
name = "Pack an infant go-kit from CDC's checklist"
category = "special_needs"
unit = "action"
buckets = ["supplies", "evacuate"]
tier = "now"
free = true
spec = "Use CDC's emergency checklist for families with infants: formula or breastfeeding supplies, diapers and wipes, an infant thermometer, a bulb syringe, a pain reliever made for infants, warm sleepwear or a sleep sack, and a portable crib. Babies under one should never sleep in a cold room (CDC)."
look_for = [
  "CDC's printable checklist, ticked off",
  "Supplies in the size your baby uses now",
  "A monthly check that the kit still fits your baby's needs",
]
avoid = [
  "Adult medicines for babies",
  "Letting the baby sleep in a cold room during an outage",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free to assemble from what you have; formula and diapers are priced as their own items." }
quantity_rule = "once_if_infant"
maintenance = { check_months = 1 }
citations = ["cdc_infant_checklist", "cdc_winter_safety"]
