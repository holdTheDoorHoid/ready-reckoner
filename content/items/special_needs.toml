[[item]]
id = "special_pet_plan"
name = "Pet plan: microchip, records, a photo and a buddy"
category = "special_needs"
unit = "action"
buckets = ["evacuate"]
tier = "now"
free = true
spec = "Keep your pet's ID tag and microchip details current, put vaccination records and a recent photo with your documents, and arrange a buddy who can care for or evacuate your pets if you cannot (Ready.gov). If officials ask you to evacuate, your pets should go too."
look_for = [
  "Microchip contact details that are up to date",
  "Vaccination records and a photo of you with your pet",
  "A neighbour or friend who agrees to be your pet buddy",
]
avoid = [
  "Leaving pets behind in an evacuation",
  "Assuming every shelter and hotel takes pets: check ahead",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free if your pet is already chipped; a vet charges for a microchip." }
quantity_rule = "once_if_pets"
citations = ["ready_gov_pets", "aspca_disaster_prep"]
hazard_extras = []

