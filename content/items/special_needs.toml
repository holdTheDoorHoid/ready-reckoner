tier = "h72"
free = false
spec = "For each pet, a carrier or a leash and collar with ID, packed from what you already have: bowls, two weeks of any medicine, litter supplies for cats, copies of records and a recent photo in a waterproof bag, plus the food and water you set aside for the kit (Ready.gov, ASPCA)."
