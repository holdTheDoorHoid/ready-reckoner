  "Records, a recent photo of you with your pet, and your contact details",
  "The food and water set aside for the kit, swapped every two months",
]
avoid = [
  "A carrier your pet has never been inside: practice first",
  "Buying a packed kit that repeats what you already have",
]
price_band_usd = { low = 29.93, high = 34.99, per = "pet", note = "A carrier you already own costs nothing. New, two home-center listings for medium soft pet carriers: $29.93 and $34.99. Food, water and medicine come from your household supply." }
