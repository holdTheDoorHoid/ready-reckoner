[[item]]
id = "thermal_cooling_towel"
name = "Towels to wet and cool down"
category = "thermal"
unit = "towel"
buckets = ["thermal"]
tier = "h72"
free = false
assumed_basic = true
spec = "A towel or cloth for each person to wet and put on the body in a heat wave: CDC's advice for someone with heat exhaustion is to move them to a cool place, give them water and put cool wet cloths on their body. Ordinary bath towels work, and most homes have them."
look_for = [
  "One towel or cloth per person, kept near the water",
  "A bowl or bucket to re-wet them",
]
avoid = [
  "Waiting for heat illness to get worse: call 911 for heat stroke (Ready.gov)",
  "Using wet towels instead of moving somewhere cooler",
]
price_band_usd = { low = 7.5, high = 13.84, per = "towel", note = "A towel you already own costs nothing. New, two home-center listings for bath towels: $7.50 each in a four-piece set, $13.84 each in a set of two." }
retrieved = "2026-09-26"
quantity_rule = "cooling_towel"
citations = ["cdc_hot_weather_psa", "ready_gov_heat", "rr_price_observations_2026_09"]
