# Dangerous heat or cold indoors: warm and cool rooms, safe heat, hydration. Rules:
# docs/CONTENT_STANDARDS.md §3. Prices: docs/PRICE_OBSERVATIONS.md (observed 2026-09-25).

[[item]]
id = "thermal_warm_room_plan"
name = "Pick a warm room for a winter outage"
category = "thermal"
unit = "action"
buckets = ["thermal"]
tier = "now"
free = true
spec = "If the heat goes off in winter, gather everyone in one small room: close off unneeded rooms, stuff towels in the cracks under doors, and cover windows with blankets at night (CDC). Wear layers and hats, and use sleeping bags."
look_for = [
  "A small interior room with few windows",
  "Blankets and towels you can use to seal gaps",
  "A way to check on older relatives and neighbours",
]
avoid = [
  "Heating with a gas oven or stovetop (CDC)",
  "Letting an infant sleep in a cold room (CDC)",
  "Grills, camp stoves or generators indoors (carbon monoxide)",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: uses what you have." }
quantity_rule = "once"
citations = ["cdc_winter_safety", "cdc_co_basics"]
hazard_extras = ["cold_wave", "winter_weather", "ice_storm"]

[[item]]
id = "thermal_cool_room_plan"
name = "Plan how to stay cool: a cool room and your nearest cooling center"
category = "thermal"
unit = "action"
buckets = ["thermal"]
tier = "now"
free = true
spec = "In a heat wave, use the coolest, lowest room, cover sunny windows with drapes or shades, take cool showers and use the oven less (Ready.gov). Find your nearest cooling center or other air-conditioned place and how you would get there without power; CDC suggests dialing 2-1-1. If a room goes above 90°F a fan stops helping, so go somewhere cooler (CDC)."
look_for = [
  "A shaded, low room (heat rises), with drapes or window reflectors for sunny windows",
  "The address and hours of the nearest cooling center or library",
  "A ride plan for anyone who does not drive",
  "A daily check-in with older or ill relatives and neighbours in heat",
]
avoid = [
  "Relying on a fan when the room is above 90°F (CDC)",
  "Leaving people or pets in a closed car (Ready.gov)",
  "Waiting until someone feels ill to leave a hot home",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a plan." }
quantity_rule = "once"
citations = ["ready_gov_heat", "cdc_heat_health", "semenza_1996_heat_deaths"]
hazard_extras = ["heat_wave"]

