# Leaving quickly, or staying put when told to: zones, go-bags, triggers and drills.
# Rules: docs/CONTENT_STANDARDS.md §3. Prices: docs/PRICE_OBSERVATIONS.md (observed 2026-09-25).

[[item]]
id = "evac_know_zone"
name = "Plan how you would leave: zone, routes, destination and triggers"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "get_home", "fire", "security"]
tier = "now"
free = true
spec = "Look up your evacuation zone and routes on your state and county emergency management websites, mark two routes on a paper map, and pick where you would go, pet-friendly if you have pets (Ready.gov). For each likely hazard, write a go-or-stay card and an if-then trigger, such as 'If our zone gets an evacuation warning, we leave within 30 minutes.' Plans written in if-then form make people more likely to follow through."
look_for = [
  "Your zone name or number for home, work and school",
  "Two routes out in different directions, marked on a paper map for the car and the go-bag",
  "Two destinations, one out of the area and pet-friendly if you have pets",
  "A go-or-stay card for each hazard your plan names, kept by the door",
  "Each trigger with a time limit, a meeting place and who does each task",
]
avoid = [
  "Planning to follow the crowd without a destination",
  "Assuming public shelters take pets: many take only service animals",
  "Relying only on phone navigation",
  "Deciding for the first time while the warning is sounding",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: planning, and a free state road map or a printed county map." }
quantity_rule = "once"
citations = ["ready_gov_evacuation", "ready_gov_hurricanes", "ready_gov_pets", "aspca_disaster_prep", "ready_gov_kit", "gollwitzer_sheeran_2006", "wood_2018_milling", "rr_research_prior_art"]
hazard_extras = []
readiness_share = 1.0

[[item]]
id = "evac_half_tank"
name = "Keep your vehicle ready: half a tank, a charged battery, a good spare"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "get_home", "power"]
tier = "now"
free = true
spec = "Keep at least half a tank of gas at all times and a full tank when an evacuation looks likely (Ready.gov); if you drive an electric car, keep it charged through storm season and pick destinations within its range (Hillsborough County, Florida). Check the spare tire with the others each month, and keep a phone charging cable in the car (NHTSA). Run the engine only outdoors, never in a garage (CDC)."
look_for = [
  "Refueling when the gauge reaches half, and filling up when a storm is forecast",
  "Electric car: charged to full before any warning, and destinations within about two-thirds of its range",
  "Chargers along two routes, from the federal station locator",
  "The spare, jack and lug wrench, with the spare's pressure checked monthly",
  "A phone charging cable kept in the glove box",
]
avoid = [
  "Running on empty during storm or fire season",
  "Running the engine in any garage (carbon monoxide)",
  "Driving or charging an electric car that sat in floodwater, especially salt water",
  "Storing extra gasoline inside the home",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: habits and checks." }
quantity_rule = "once_if_vehicle"
citations = ["ready_gov_evacuation", "ready_gov_winter", "hcfl_ev_safety", "doe_afdc_stations", "doe_fueleconomy_ev", "nhtsa_tires", "cdc_co_basics", "rr_expert_prior"]
hazard_extras = []
readiness_share = 0.3

[[item]]
id = "evac_ten_minute_drills"
name = "Practice: ten-minute drills and the first things to do"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "fire", "medical_emergency", "security"]
tier = "now"
free = true
spec = "Twice a year, practice for ten minutes at a time: your fire escape, grabbing the go-bag against a timer, and the first action for each hazard where you live (Ready.gov). People who have drilled know the right actions better and use them more when it is real (New Zealand ShakeOut study). Keep drills calm and short, especially with children."
look_for = [
  "Earthquake: drop to your hands and knees, cover your head and neck, and hold on until the shaking stops",
  "Tornado: go to your shelter spot, a small, windowless room or basement on the lowest floor of a sturdy building",
  "Coast: after long or strong shaking, walk to high ground right away, without waiting for an alert",
  "Flood: turn around, because six inches of moving water can knock you down",
  "Radiation: get inside, stay inside and stay tuned for at least 24 hours unless officials say otherwise",
  "A drill on the calendar, for example when the clocks change",
]
avoid = [
  "Skipping practice because the plan is written down",
  "Drills that frighten children",
  "Standing in a doorway or running outside during shaking",
  "Going to the shore to watch, or returning before officials say it is safe",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: ten minutes twice a year." }
quantity_rule = "once"
maintenance = { check_months = 6 }
citations = ["ready_gov_home_fires", "vinnell_2020_shakeout", "gargano_2017_wtc_training", "ready_gov_earthquakes", "ready_gov_tornadoes", "nws_tsunami_safety", "ready_gov_tsunamis", "dogami_tsunami_faq", "ready_gov_floods", "nws_turn_around_dont_drown", "ready_gov_nuclear", "ready_gov_radiation"]
hazard_extras = []
readiness_share = 0.5

[[item]]
id = "evac_go_bag"
name = "Go-bag for each person: a backpack you pack from your supplies"
category = "evacuation"
unit = "bag"
buckets = ["evacuate"]
tier = "h72"
free = false
assumed_basic = true
spec = "Any sturdy backpack each person can carry, packed from the household's own supplies rather than bought as a kit: about three days of water and food that needs no cooking, medicines and an old pair of glasses, copies of documents on paper and a flash drive, the contact card, a light, a whistle, first-aid basics, a phone charger, cash, and a change of clothes and sturdy shoes (Ready.gov, CDC). Most homes already have a bag for each person."
look_for = [
  "Water and no-cook food moved from your stored supplies; refill the water every six months (CDC)",
  "Three days of each person's medicines, the written medicine list, and an old pair of glasses or spare contact lenses (Ready.gov)",
  "Copies of documents and the contact card in a waterproof bag, and the same papers scanned onto a flash drive",
  "A headlamp or flashlight, spare batteries and a whistle",
  "First-aid basics, hand sanitizer and any masks you keep",
  "A phone charger or power bank, and cash in small bills",
  "A change of clothes, sturdy shoes and rain gear",
]
avoid = [
  "A bag too heavy to carry for an hour",
  "Buying a pre-packed kit that repeats what you already store",
  "Packing it once and never checking the food, water and medicines",
]
price_band_usd = { low = 29.73, high = 38.8, per = "bag", note = "A sturdy backpack you already own costs nothing. New, two home-center listings for basic backpacks: $29.73 and $38.80. The contents come from your household supplies, so nothing is bought twice." }
retrieved = "2026-09-26"
quantity_rule = "per_person"
maintenance = { check_months = 6 }
citations = ["ready_gov_evacuation", "cdc_evacuation_psa", "ready_gov_kit", "cdc_water_storage", "washington_prepare_in_a_year", "redcross_survival_kit", "ollam_2022_lawyer_passport_locksmith_gun", "fema_effak", "rr_price_observations_2026_09"]
