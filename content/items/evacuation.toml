[[item]]
id = "evac_ride_plan"
name = "No car? Plan your ride out"
category = "evacuation"
unit = "plan"
buckets = ["evacuate"]
tier = "now"
free = true
spec = "If your household has no vehicle, decide now how you would leave: a friend, relative or neighbor who would drive you, or the bus or train that leads out of your area (Ready.gov). Leave early, before roads fill. If someone in your home has a disability, ask your local emergency management office about its voluntary registry for people who need help (Ready.gov)."
look_for = [
  "One or two people who would drive you, with their numbers on your contact card",
  "The bus or train routes that lead out of your area, and where they stop near you",
  "Room for your pets and your go-bags in the ride you plan",
]
avoid = [
  "Waiting for the last bus or ride",
  "A plan that depends on a single driver",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a plan and a few phone calls." }
quantity_rule = "evacuation_ride_plan"
citations = ["ready_gov_evacuation", "ready_gov_older_adults", "ready_gov_disability"]
