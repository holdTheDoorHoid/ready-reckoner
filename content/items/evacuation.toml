# Leaving quickly, or staying put when told to: zones, go-bags, triggers and drills.
# Rules: docs/CONTENT_STANDARDS.md §3. Prices: docs/PRICE_OBSERVATIONS.md (observed 2026-09-25).

[[item]]
id = "evac_know_zone"
name = "Know your evacuation zone, routes and where you would go"
category = "evacuation"
unit = "action"
buckets = ["evacuate"]
tier = "now"
free = true
spec = "Many states set evacuation zones and routes; look up yours on your state and county emergency management websites (Ready.gov). Pick where you would go: a friend's or relative's home out of the area, a pet-friendly hotel, or a public shelter."
look_for = [
  "Your zone name or number for home, work and school",
  "Two routes out, in different directions",
  "Two destinations, one of them out of the area and pet-friendly if you have pets",
]
avoid = [
  "Planning to follow the crowd without a destination",
  "Assuming public shelters take pets: many take only service animals",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a website visit and a conversation." }
quantity_rule = "once"
citations = ["ready_gov_evacuation", "ready_gov_hurricanes", "ready_gov_pets", "aspca_disaster_prep"]
hazard_extras = []

[[item]]
id = "evac_half_tank"
name = "Keep the gas tank at least half full"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "get_home"]
tier = "now"
free = true
spec = "Ready.gov advises keeping at least half a tank of gas at all times in case you have to leave suddenly, and a full tank when an evacuation looks likely. Gas stations close or run dry when the power is out."
look_for = [
  "Refueling when the gauge reaches half",
  "Filling up as soon as a storm is forecast",
]
avoid = [
  "Running on empty during storm or fire season",
  "Storing extra gasoline inside the home",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: it changes when you buy fuel, not how much." }
quantity_rule = "once_if_vehicle"
citations = ["ready_gov_evacuation", "ready_gov_winter"]
hazard_extras = []

[[item]]
id = "evac_go_stay_card"
name = "Write a go-or-stay card for each likely hazard"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "fire", "security"]
tier = "now"
free = true
spec = "For each hazard your plan names, write one card that says when you leave, when you stay and shelter, and what you do first. People who get complete warnings spend less time checking with others before acting, and a card decided in advance works the same way."
look_for = [
  "One short card per hazard, such as flood, wildfire, tornado or chemical release",
  "The trigger, the action and who does what",
  "Cards kept by the door and in each go-bag",
]
avoid = [
  "Deciding for the first time while the warning is sounding",
  "Waiting to see what the neighbours do",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: index cards and a pen." }
quantity_rule = "once"
citations = ["wood_2018_milling", "rr_research_prior_art"]
hazard_extras = []

[[item]]
id = "evac_if_then_triggers"
name = "Agree if-then triggers for leaving"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "fire", "security"]
tier = "now"
free = true
spec = "Write short promises such as 'If the county issues an evacuation warning for our zone, we leave within 30 minutes; the bag is by the door; Sam gets the kids.' Plans in if-then form make people much more likely to follow through."
look_for = [
  "A trigger you will actually hear, such as an alert or a smell of smoke",
  "A time limit, a place to meet and who does each task",
  "Everyone in the household agreeing",
]
avoid = [
  "Vague plans like 'we'll leave if it gets bad'",
  "Triggers that depend on seeing the danger yourself",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: ten minutes of talk." }
quantity_rule = "once"
citations = ["gollwitzer_sheeran_2006", "rr_research_prior_art"]
hazard_extras = []

[[item]]
id = "evac_ten_minute_drills"
name = "Run ten-minute drills twice a year"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "fire", "security", "medical_emergency"]
tier = "now"
free = true
spec = "Practice a fire escape, grabbing the go-bag against a timer, or Drop, Cover and Hold On, for ten minutes at a time. Ready.gov advises practicing your home fire escape plan twice a year, and people who have drilled act faster and cope better in real emergencies."
look_for = [
  "A drill on the calendar every six months, for example when clocks change",
  "Children taking part, and learning not to hide from firefighters",
  "A quick talk afterward about what to fix",
]
avoid = [
  "Drills that frighten children: keep them calm and short",
  "Skipping practice because the plan is written down",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: ten minutes, twice a year." }
quantity_rule = "once"
maintenance = { check_months = 6 }
citations = ["ready_gov_home_fires", "vinnell_2020_shakeout", "gargano_2017_wtc_training"]
hazard_extras = []

[[item]]
id = "evac_tsunami_high_ground"
name = "Coast: walk to high ground right after a long or strong earthquake"
category = "evacuation"
unit = "action"
buckets = ["evacuate"]
tier = "now"
free = true
spec = "If you are near the coast and feel an earthquake, move off the beach to high ground or inland as soon as it is safe, without waiting for an alert: a tsunami can arrive within minutes (NWS). Learn the walking route to high ground from home, work and school."
look_for = [
  "Tsunami evacuation route signs and maps for places you spend time",
  "A walking route that avoids bridges",
  "The natural warnings: long shaking, the sea pulling back, a roar from the ocean",
]
avoid = [
  "Driving if the route may be blocked: walk",
  "Going to the shore to watch",
  "Returning before officials say it is safe; waves can keep coming for hours",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a walk and a map." }
quantity_rule = "once"
citations = ["nws_tsunami_safety", "ready_gov_tsunamis", "dogami_tsunami_faq"]
hazard_extras = ["tsunami"]

[[item]]
id = "evac_quake_drop_cover"
name = "Know Drop, Cover and Hold On"
category = "evacuation"
unit = "action"
buckets = ["medical_emergency", "evacuate"]
tier = "now"
free = true
spec = "When shaking starts, drop to your hands and knees, cover your head and neck, and hold on until it stops (Ready.gov). Stay inside and away from doorways; after the shaking, expect aftershocks and check for gas leaks and damage."
look_for = [
  "A sturdy table or desk in each room you use",
  "Heavy items stored on low shelves",
  "A practice drill with the household",
]
avoid = [
  "Running outside during shaking",
  "Standing in a doorway",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: practice." }
quantity_rule = "once"
citations = ["ready_gov_earthquakes", "vinnell_2020_shakeout"]
hazard_extras = ["earthquake"]

[[item]]
id = "evac_flood_turn_around"
name = "Never walk or drive through floodwater"
category = "evacuation"
unit = "action"
buckets = ["evacuate", "get_home"]
tier = "now"
free = true
spec = "Just six inches of moving water can knock you down and one foot can sweep a vehicle away (Ready.gov). Turn around and find another way, and move to higher ground or a higher floor if water rises."
look_for = [
  "Routes from home and work that avoid low spots and underpasses",
  "Knowing whether your home is in a flood zone",
]
avoid = [
  "Driving around barricades",
  "Walking through water that may hide downed power lines",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a rule to live by." }
quantity_rule = "once"
citations = ["ready_gov_floods", "nws_turn_around_dont_drown"]
hazard_extras = ["riverine_flooding", "coastal_flooding", "hurricane"]

[[item]]
id = "evac_tornado_shelter_spot"
name = "Pick your tornado shelter spot"
category = "evacuation"
unit = "action"
buckets = ["security", "medical_emergency"]
tier = "now"
free = true
spec = "Choose where you will go when a tornado warning sounds: a safe room or storm shelter if you have one, otherwise a small, interior, windowless room or basement on the lowest floor of a sturdy building (Ready.gov). If you live in a mobile home, plan which sturdy building you would go to instead."
look_for = [
  "The lowest, most central room in your home",
  "A nearby sturdy building if you live in a mobile home",
  "Shoes, a flashlight and helmets or pillows kept there",
]
avoid = [
  "Rooms with windows",
  "Waiting to see the tornado before moving",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a decision made in advance." }
quantity_rule = "once"
citations = ["ready_gov_tornadoes"]
hazard_extras = ["tornado", "strong_wind"]

