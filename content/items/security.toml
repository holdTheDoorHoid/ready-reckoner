[[item]]
id = "security_scam_awareness"
name = "Know the signs of disaster scams"
category = "security"
unit = "action"
buckets = ["security", "home_loss"]
tier = "now"
free = true
spec = "After disasters, scammers pose as contractors, charities and even government staff. Be wary of anyone who rushes you, wants payment in cash, gift cards or wire transfers, or asks for personal details, and report scams at ReportFraud.ftc.gov (FTC)."
look_for = [
  "Contractors with a local address, a license you can check and a written estimate",
  "Charities you can look up yourself before giving",
  "Official help reached through numbers and websites you found yourself",
]
avoid = [
  "Paying upfront in cash, gift cards or wire transfers",
  "Giving bank or Social Security numbers to someone who called you",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: knowing the warning signs." }
quantity_rule = "once"
citations = ["ftc_disaster_scams"]
hazard_extras = []

