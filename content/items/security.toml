[[item]]
id = "security_home_basics"
name = "Home and personal security: lock up, protect accounts, spot scams, stay calm"
category = "security"
unit = "action"
buckets = ["security", "comms", "income", "home_loss"]
tier = "now"
free = true
spec = "Lock doors and windows as a habit, light the places someone could hide, and leave a spare key with a trusted neighbour instead of under the mat (NCPC). Turn on two-step login for your bank, email and phone accounts, keep devices updated, and after a disaster be wary of anyone who rushes you or wants payment in cash, gift cards or wire transfers (Ready.gov, CISA, FTC). In a tense moment, notice what is happening, say hello, judge the risk and get help; if an attack happens in a public place, getting away is the top priority (CISA, Ready.gov)."
look_for = [
  "Working locks on every outside door and ground-floor window, and clear, lit paths",
  "A neighbour who holds a spare key and watches the house when you are away",
  "Two-step login on email, bank and phone accounts, and automatic updates turned on",
  "Contractors with a local address and a license you can check, and charities you look up yourself",
  "The two nearest exits wherever you go",
]
avoid = [
  "A key under the doormat, a planter or in the mailbox",
  "Clicking links in messages that rush you or ask for personal details",
  "Paying upfront in cash, gift cards or wire transfers",
  "Arguing with someone who is escalating",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: habits and account settings." }
