[[item]]
id = "security_key_safe"
name = "Key safe for a spare house key"
category = "security"
unit = "key safe"
buckets = ["security", "get_home"]
tier = "w2"
free = false
spec = "A sturdy key safe bolted to the wall out of sight, with a push-button or dial code, so family, a neighbour or a responder can let you in when you are locked out, away or hurt. Where you can, choose a model an independent test lab has attack-tested and rated (Sold Secure publishes its list); cheap boxes with four small dials are easy to pry off or decode."
look_for = [
  "Solid metal, bolted into brick, concrete or framing, never hung on a doorknob",
  "A code of five digits or more that you can change (Thurrock Council, UK)",
  "A spot hidden from the street",
  "A test every six months: open it with the code and try the key in the door",
]
avoid = [
  "A cheap four-dial box or a fake rock",
  "Leaving the factory code, or writing the code on the box",
]
price_band_usd = { low = 37.0, high = 62.57, per = "key safe", note = "Two home-center listings for wall-mounted push-button key safes: $37.00 and $62.57. A spare key with a trusted neighbour costs nothing." }
retrieved = "2026-09-26"
quantity_rule = "once_if_house"
citations = ["sold_secure_key_safes", "thurrock_key_safe_advice", "ollam_2022_lawyer_passport_locksmith_gun", "rr_expert_prior", "rr_price_observations_2026_09"]
hazard_extras = []
readiness_share = 0.2
test_interval_months = 6

