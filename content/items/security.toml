hazard_extras = []

[[item]]
id = "security_home_basics"
name = "Lock up, light up, and keep the spare key with a neighbour"
category = "security"
unit = "action"
buckets = ["security"]
tier = "now"
free = true
spec = "Lock doors and windows as a habit, leave no easy hiding places by the doors, and use timers on lights when you are away. Keep a spare key with a trusted neighbour instead of under the mat (National Crime Prevention Council)."
look_for = [
  "Working locks on every outside door and ground-floor window",
  "Clear, lit paths to your doors",
  "A neighbour who holds a spare key and watches the house when you are away",
]
avoid = [
  "A key under the doormat, a planter or in the mailbox",
  "Posting travel plans or new purchases online",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: habits and a spare key you already have." }
quantity_rule = "once"
citations = ["ncpc_home_safety", "ready_gov_cybersecurity"]
hazard_extras = []

