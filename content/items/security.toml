tier = "now"
free = true
spec = "Plan now for being locked out of your home or car. Leave a spare key with a family member, neighbour or friend. Find a local locksmith before you need one and save the number, because some locksmiths who advertise are not local or trained (FTC)."
look_for = [
  "A spare house key with someone nearby",
  "A locksmith's number in your phone and on paper",
  "A test call to the locksmith's after-hours line",
  "Your roadside or insurance number for a car lockout or tow",
]
avoid = [
  "Choosing a locksmith from an ad while you are locked out",
  "A cheap combination key box that is easy to open",
]
