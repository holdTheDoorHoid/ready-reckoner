[[item]]
id = "security_firearms_safe_storage"
name = "If you own firearms: safe storage and training"
category = "security"
unit = "action"
buckets = ["security"]
tier = "now"
free = true
spec = "Firearms are a personal and legal decision, and this plan never budgets for them. Research finds that having a firearm at home is linked to a higher risk of suicide for the people who live there, so if you own firearms, store them locked and unloaded and get training."
look_for = [
  "A locked safe, lockbox or cable lock for each firearm",
  "Ammunition locked up apart from the firearms",
  "A safety course from a certified instructor, and your state's storage laws",
  "988 saved in every phone in the house",
]
avoid = [
  "Firearms left loaded or unlocked where children, visitors or someone in crisis could reach them",
  "Counting firearms as a substitute for water, heat, medicine or neighbours",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free action: the plan never includes firearms, ammunition or related equipment in a budget." }
quantity_rule = "once"
