[[item]]
id = "gethome_car_kit"
name = "Car emergency kit"
category = "get_home"
unit = "kit"
buckets = ["get_home", "evacuate"]
tier = "h72"
free = false
spec = "The Ready.gov car kit: jumper cables, sand, a flashlight, warm clothes, blankets, bottled water and non-perishable snacks. If stranded in snow, CDC advises running the engine about 10 minutes an hour with a window slightly open and the exhaust pipe clear."
look_for = [
  "Jumper cables and a flashlight with fresh batteries",
  "Blankets or a sleeping bag and warm clothes",
  "Sand or cat litter and an ice scraper in snow country",
]
avoid = [
  "Running the engine with snow blocking the exhaust pipe",
  "Leaving the kit's water and snacks to expire",
]
price_band_usd = { low = 129.95, high = 149.74, per = "kit", note = "Two retail car survival kits: $129.95 and $149.74. Assembling your own from the list, using what you already own, usually costs less." }
retrieved = "2026-09-25"
quantity_rule = "per_vehicle"
maintenance = { check_months = 6 }
citations = ["ready_gov_winter", "cdc_winter_safety", "rr_price_observations_2026_09"]
