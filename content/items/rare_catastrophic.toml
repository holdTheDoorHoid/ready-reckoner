# Rare and catastrophic: nuclear, radiological, EMP. General supplies already cover the sheltering
# phase; specialised items are rare_catastrophic = true, tier y1, $0 by default and capped at 10% of
# the monthly budget on opt-in (DESIGN §4.7). Potassium iodide appears only with official
# instructions and only within a plant's emergency planning zone (CONTENT_STANDARDS §5).

[[item]]
id = "rare_potassium_iodide"
name = "Potassium iodide: only on official instruction, near a nuclear plant"
category = "rare_catastrophic"
unit = "action"
buckets = ["medication"]
tier = "y1"
free = true
rare_catastrophic = true
spec = "Potassium iodide protects only the thyroid and matters only near a nuclear plant: federal programs supply it to states for people within the 10-mile emergency planning zone. If you live there, ask your state or county health department about its program, and take it only when public health officials tell you to (CDC)."
look_for = [
  "Your state or county health department's plan for your zone",
  "Where local officials would hand it out",
  "The alert channel that would give the instruction",
]
avoid = [
  "Taking it on your own: CDC says it can cause harm and is useful only in specific situations",
  "Buying it outside a plant's emergency planning zone",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: public health programs supply it where it is needed." }
quantity_rule = "once_if_near_nuclear_plant"
citations = ["cdc_potassium_iodide", "nrc_potassium_iodide", "ready_gov_radiation"]
hazard_extras = ["nuclear_plant_incident"]

[[item]]
