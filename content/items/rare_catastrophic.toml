name = "Personal radiation dosimeter card"
category = "rare_catastrophic"
unit = "dosimeter"
buckets = ["supplies"]
tier = "y1"
free = false
rare_catastrophic = true
spec = "A card that changes color to show how much radiation it has absorbed. It is optional: in a radiation emergency, official instructions on when to shelter and when to leave matter far more than your own reading."
look_for = [
  "A clear color scale printed on the card",
  "An expiry date on the package",
]
avoid = [
  "Treating it as permission to leave shelter early",
  "Spending on it before water, medicine and the three-day basics",
]
