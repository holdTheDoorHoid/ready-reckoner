[[item]]
id = "food_bulk_staples"
name = "Dry staples for long storage (rice, beans, oats, wheat)"
category = "food"
unit = "2,000 kcal"
buckets = ["supplies"]
tier = "m3"
free = false
spec = "White rice, dried beans, rolled oats and wheat sealed against air and moisture, for plans that run to three months or more. Packed this way and kept below 75°F they last about 20 to 30 years, but they need water, fuel and time to cook."
look_for = [
  "Food-safe buckets, #10 cans or sealed bags with oxygen absorbers",
  "White rice rather than brown, which goes rancid",
  "A plan for the cooking fuel and extra water they need",
]
avoid = [
  "A hot garage or attic: wheat kept about 25 years cool but only about 5 years hot (Utah State University)",
  "Putting moist foods in oxygen-free packs (botulism risk)",
  "Living on staples alone for months: add oil, vegetables and a vitamin source",
]
price_band_usd = { low = 1.34, high = 2.16, per = "2,000 kcal", note = "Four observations, August 2026: white rice and dried beans at US average prices ($1.34 and $2.07 per 2,000 kcal) and canned wheat and pinto beans from a home-storage center ($1.72 and $2.16)." }
retrieved = "2026-09-25"
quantity_rule = "food_kcal"
energy_kcal_per_unit = 2000
maintenance = { check_months = 12 }
