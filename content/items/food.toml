name = "Dry staples for long storage (rice, beans, oats, wheat)"
category = "food"
unit = "2,000 kcal"
buckets = ["supplies"]
tier = "m3"
free = false
spec = "White rice, dried beans, rolled oats and wheat sealed against air and moisture, for plans that run to three months or more. Packed this way and kept below 75°F they last about 20 to 30 years, but they need water, fuel and time to cook."
