category = "food"
unit = "stove"
buckets = ["water_boil", "supplies"]
tier = "h72"
free = false
spec = "A one-burner camp stove for boiling water and heating food outdoors when the power is out. Choose one that burns 1-pound propane cylinders, which keep working in freezing weather when butane does not (NIST); a butane-only stove suits only places where winters stay mild. Never use it indoors, in a garage or on a closed porch, because of carbon monoxide (CDC)."
look_for = [
  "A stove that takes 1-pound propane cylinders (dual-fuel stoves take butane canisters too)",
  "A stable base that holds a pot big enough for boiling water",
  "A lighter or waterproof matches kept with it",
]
avoid = [
  "Using it indoors, in a garage or on a closed porch",
  "A butane-only stove where winters freeze",
  "Keeping fuel near heat or in a hot car",
  "Leaving it burning unattended",
]
price_band_usd = { low = 29.99, high = 40.75, per = "stove", note = "Two home-center listings for one-burner stoves that burn propane or butane: $29.99 and $40.75." }
retrieved = "2026-09-26"
quantity_rule = "cooking_capability"
citations = ["cdc_co_basics", "cdc_infant_checklist", "nist_propane", "nist_butane", "oregon_2_weeks_ready", "rr_price_observations_2026_09"]
