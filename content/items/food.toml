# Food: planned in calories, never "servings". Rules: docs/CONTENT_STANDARDS.md §3.
# Price bands come from docs/PRICE_OBSERVATIONS.md (observed 2026-09-25). One unit of a food item is
# 2,000 kcal, about one adult-day, so the app can show cost per 2,000 kcal.

[[item]]
id = "food_pantry_rotation"
name = "Extra shelf-stable food you already eat"
category = "food"
unit = "2,000 kcal"
buckets = ["supplies"]
tier = "h72"
free = false
spec = "Canned and dry foods your household already eats that need little or no cooking: canned meat, fish, beans, fruit and vegetables, peanut butter, cereal and crackers. Plan in calories (about 1,800 to 2,800 a day for an adult, less for children) and eat and replace them in normal shopping."
look_for = [
  "Foods your household already eats and likes",
  "Ready to eat or quick to heat",
  "Pull-tab lids or a manual can opener",
  "Special diets, baby food and comfort foods covered",
]
avoid = [
  "Swollen, leaking, rusted or badly dented cans (USDA)",
  "Storing food above 85°F: cooler places keep it longer (USDA)",
  "Counting 'servings' instead of calories",
]
price_band_usd = { low = 8.44, high = 10.46, per = "2,000 kcal", note = "USDA's August 2026 food plans: $8.44 per person-day on the Thrifty plan for a family of four and $10.46 on the Low-Cost plan for a man aged 19–50, for a full everyday diet of about 2,000 kcal." }
retrieved = "2026-09-25"
quantity_rule = "food_kcal"
energy_kcal_per_unit = 2000
maintenance = { rotate_months = 12 }
citations = ["ready_gov_food", "fsis_shelf_stable", "usda_dga_2020_2025", "usda_tfp_aug2026", "usda_food_plans_aug2026", "rr_price_observations_2026_09"]
