[[item]]
id = "comms_contact_card"
name = "Make a household plan and a contact card for each person"
category = "comms"
unit = "action"
buckets = ["comms", "evacuate", "get_home"]
tier = "now"
free = true
spec = "Agree how you will reach each other, where you will meet if you are separated, and who picks up the children (Ready.gov). Pick one out-of-state contact everyone texts to say they are safe, since texts often get through when calls do not, and write key numbers on a card for each wallet or bag (Ready.gov). Add school, daycare and work plans, and go over the plan together once a year."
look_for = [
  "A meeting place near home and one outside the neighbourhood",
  "An out-of-state contact whose number is on every card",
  "A card in every wallet, backpack and go-bag, from Ready.gov's free fillable form",
  "Children: the school or daycare's shelter plan and up-to-date pick-up adults",
  "Commuters: your workplace's shelter plan, and a walking route home you have partly walked",
  "Each person's medical needs and pets written into the plan",
]
avoid = [
  "A plan only one person knows",
  "Relying on a phone's contact list that dies with the battery",
  "Choosing a contact who lives nearby and faces the same disaster",
  "Driving into a danger zone to reach a school that is already sheltering",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: a conversation and Ready.gov's printable card." }
quantity_rule = "once"
maintenance = { check_months = 12 }
citations = ["ready_gov_plan", "ready_gov_family_comm_card", "ready_gov_low_cost", "ready_gov_earthquakes", "ready_gov_kit_2020", "fema_effak"]
