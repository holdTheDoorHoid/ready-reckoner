[[item]]
id = "comms_wea_alerts_on"
name = "Set up emergency alerts and know how to reach 911"
category = "comms"
unit = "action"
buckets = ["comms", "evacuate", "medical_emergency", "power"]
tier = "now"
free = true
spec = "Make sure every phone can get warnings: Wireless Emergency Alerts are free and need no sign-up (Ready.gov), but a phone only gets them when it is on, not in airplane mode, and served by a carrier that takes part (FCC). Add your county's text and email alerts and your power company's outage texts for local news. Call 911 when you can, because texting 911 works only in some places (FCC)."
look_for = [
  "Emergency and public safety alerts switched on in every phone's settings",
  "Your county's text and email alerts, for home, work and school addresses",
  "Your power company's outage number and text alerts, written on paper too",
  "Whether your county accepts texts to 911, and children who know how to call",
  "Your address written by the phone for visitors and sitters",
]
avoid = [
  "Turning alerts off because a test was annoying",
  "Assuming national alerts cover local notices such as boil-water orders",
  "Texting 911 when you could call",
  "Going near downed power lines: stay away and report them",
]
price_band_usd = { low = 0, high = 0, per = "action", note = "Free: phone settings and sign-ups." }
quantity_rule = "once"
citations = ["ready_gov_alerts", "fcc_wea", "ready_gov_plan", "ready_gov_power_outages", "fcc_text_911"]
