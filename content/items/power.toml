[[item]]
id = "power_generator"
name = "Portable generator (outdoors only, 20 feet from the house)"
category = "power"
unit = "generator"
buckets = ["power", "thermal", "water_out"]
tier = "w2"
free = false
spec = "A gasoline portable generator sized to what it must run: a 2,000 to 3,000 watt inverter runs a fridge and lights, but a well pump needs one that supplies the pump's starting watts, 2 to 3 times its running watts, with a 240-volt outlet if the pump runs on 240 volts. It must run outdoors, 20 feet or more from windows, doors and vents (CDC), and it reaches house wiring only through an interlock or transfer switch an electrician installs (OSHA). A small inverter uses about 2.8 gallons of fuel a day at light load and up to 7 at full load; bigger units use more."
look_for = [
  "A built-in carbon monoxide sensor that shuts it off",
  "For a well pump: starting watts above the pump's, and a 240-volt outlet if the pump needs it (check its nameplate)",
  "Heavy-duty outdoor extension cords to plug appliances into it directly (Ready.gov)",
  "A carbon monoxide alarm inside the house",
]
avoid = [
  "Running it in a garage, porch or near any opening, even with doors open (CDC)",
  "Plugging it into a wall outlet or the house wiring: backfeeding can electrocute utility workers and neighbours (CPSC)",
  "Buying one if you live in an apartment or cannot keep it 20 feet from the building",
  "Assuming a small unit can start a well pump: check the pump's starting watts",
]
price_band_usd = { low = 389.99, high = 949, per = "generator", note = "Four home-center listings: 2,300 and 2,800 W inverter generators at $389.99 and $499 run a fridge and lights; units with a 120/240-volt outlet that can start a well pump cost $579 (5,300 W running) and $949 (7,500 W running)." }
retrieved = "2026-09-26"
quantity_rule = "generator_units"
maintenance = { check_months = 3 }
citations = ["cdc_co_basics", "ready_gov_power_outages", "osha_portable_generators", "cpsc_generator_safety_alert", "rr_research_supply_standards", "rr_expert_prior", "rr_price_observations_2026_09"]
hazard_extras = []

