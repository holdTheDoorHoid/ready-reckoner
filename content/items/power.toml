[[item]]
id = "power_transfer_interlock"
name = "Generator inlet and interlock or transfer switch, installed by an electrician"
category = "power"
unit = "installed kit"
buckets = ["power", "water_out"]
tier = "h72"
free = false
spec = "An inlet on the outside wall with an interlock kit on the main panel, or a transfer switch, installed by a licensed electrician, so a portable generator can run the well pump and other chosen circuits. It is the only safe way to connect a generator to house wiring: OSHA says to attach one only through a transfer switch a qualified electrician installed, and CPSC warns that plugging a generator into a wall outlet can electrocute utility workers and neighbours."
look_for = [
  "A licensed electrician, and a permit where your town requires one",
  "An inlet and interlock rated for your generator's outlet, 240 volts if your well pump runs on it",
  "A labeled list of the circuits it can run, with the well pump first",
]
avoid = [
  "A cord with a plug on both ends: it backfeeds the house wiring (CPSC)",
  "Running the generator while the main breaker is still on",
  "Installing it yourself",
]
price_band_usd = { low = 400, high = 1400, per = "installed kit", note = "Two electricians' published prices for a professionally installed interlock kit with an inlet, July and January 2026: $400 to $850 in the Twin Cities and $900 to $1,400 in the Dallas-Fort Worth area, permit included in the second. A manual transfer switch costs more." }
retrieved = "2026-09-26"
quantity_rule = "generator_connection_units"
maintenance = { check_months = 12 }
citations = ["osha_portable_generators", "cpsc_generator_safety_alert", "rr_price_observations_2026_09"]
hazard_extras = []

