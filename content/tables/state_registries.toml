# State table: evacuation-zone lookups, registries for people who may need help in a disaster,
# alert sign-ups and emergency prescription-refill rules, one row per state, DC and Puerto Rico.
# Rules: docs/CONTENT_STANDARDS.md §10. Checked 2026-09-26; how each address was read is in
# docs/CITATION_IDS.md ("State table"). A zone, registry or alert entry is listed only where a
# state-level tool was confirmed on the page itself. Every other row sends the household to its
# local office through the state agency, whose site is the source for that line. Refill rules come
# from Healthcare Ready's 2022 review (all 50 states and DC), with a second source where one was
# read: where two sources disagree, the row says so and asks the household to ask a pharmacist.

