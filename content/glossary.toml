# Ready Reckoner glossary. CC BY-SA 4.0 (see LICENSE-CONTENT).
#
# Plain phrase first, the technical term second (docs/PRINCIPLES.md §12). Definitions are one or
# two plain sentences; any number or rule in a definition cites content/citations.toml.
# Rules: docs/CONTENT_STANDARDS.md §9.

# ---------------------------------------------------------------------------------------------
# How the numbers work
# ---------------------------------------------------------------------------------------------

[[term]]
plain = "How rare an event to be ready for"
term = "Return period"
definition = "How often, on average, an event this bad or worse happens. A 1-in-100 event has a 1 in 100 chance each year, so it can still happen two years in a row."
citations = ["rr_research_risk_model", "fema_flood_zones"]

[[term]]
plain = "The chance of going past a level"
term = "Exceedance probability"
definition = "The chance that a disruption is worse than a given level, such as an outage that lasts longer than 3 days in a year."
citations = ["rr_research_risk_model"]

[[term]]
plain = "Being ready for 9 of 10 ten-year stretches, for each need"
term = "Design event (the default dial setting)"
definition = "The size of disruption the plan covers by default. For any one need, something worse than its target comes in about 1 of every 10 ten-year stretches; across all your needs together, the chance that at least one runs out is roughly 1 in 3."
citations = ["rr_research_risk_model"]

[[term]]
plain = "A chance shown as a count"
term = "Natural frequency"
definition = "A chance written as a count, such as \"about 12 of 100 households like yours.\" People understand counts better than percentages."
citations = ["akl_2011_cochrane_frequencies", "gigerenzer_2007_statistics"]

[[term]]
plain = "An expert estimate"
term = "Prior"
definition = "A number based on expert judgment where good data does not exist. The plan labels every one and explains the reasoning."
citations = ["rr_expert_prior", "rr_risk_model_priors"]

[[term]]
plain = "Planning for what happens, not what causes it"
term = "All-hazards planning"
definition = "Planning for consequences such as no power or no water, because many different hazards lead to the same few problems."
citations = ["fema_cpg201_thira", "rr_research_risk_model"]

# ---------------------------------------------------------------------------------------------
# Water, food and power
# ---------------------------------------------------------------------------------------------

[[term]]
plain = "Tap water must be boiled"
term = "Boil water advisory"
definition = "An official notice that tap water may carry germs. Boil it at a rolling boil for one minute, longer at high altitude, or use bottled water."
citations = ["cdc_water_advisories", "epa_emergency_disinfection"]

[[term]]
plain = "Do not drink the tap water at all"
term = "Do not drink advisory"
definition = "Officials say not to drink tap water, often because of chemicals. Boiling does not make it safe, so use stored or bottled water."
citations = ["cdc_water_advisories"]

[[term]]
plain = "The active part of household bleach"
term = "Sodium hypochlorite"
definition = "The chemical in household bleach that kills germs. To treat water, use plain unscented bleach, such as 8 drops of 6% bleach per gallon, and wait 30 minutes."
citations = ["epa_emergency_disinfection", "cdc_water_storage"]

[[term]]
plain = "Two-bucket emergency toilet"
term = "Twin-bucket toilet"
definition = "Two buckets, one for pee and one for poo with a layer of dry cover material, used when toilets cannot flush."
citations = ["rdpo_emergency_toilet"]

[[term]]
plain = "Food energy"
term = "kcal (kilocalories, or calories)"
definition = "The energy in food. The plan counts food in calories, not servings. Most adults need about 1,600 to 3,000 calories a day."
citations = ["usda_dga_2020_2025"]

[[term]]
plain = "Oldest first"
term = "First in, first out (FIFO)"
definition = "Use the oldest supplies first and replace them as you shop, so nothing sits until it spoils."
citations = ["fsis_shelf_stable"]

[[term]]
plain = "How much energy a battery holds"
term = "Wh (watt-hour)"
definition = "A unit of battery energy. A 1,000 Wh power station runs a 100-watt device for roughly 8 to 9 hours once conversion losses are counted."
citations = ["rr_research_supply_standards"]

[[term]]
plain = "A big rechargeable battery with outlets"
term = "Portable power station"
definition = "A large battery that can run lights, phones and small devices. It burns no fuel, so it makes no carbon monoxide."
citations = ["cdc_co_basics"]

[[term]]
plain = "The poison gas from burning fuel"
term = "Carbon monoxide (CO)"
definition = "A gas with no color or smell, made whenever fuel burns. Run generators, grills and camp stoves only outdoors, and keep a CO alarm on every level."
citations = ["cdc_co_basics", "ready_gov_power_outages"]

[[term]]
plain = "Medicine that must stay cold"
term = "Refrigerated medication"
definition = "Medicine such as insulin that must be kept cool. If the power is out for more than a day, throw out refrigerated medicine unless the label says otherwise."
citations = ["ready_gov_power_outages", "cdc_insulin_emergency"]

# ---------------------------------------------------------------------------------------------
# Power outages
# ---------------------------------------------------------------------------------------------

[[term]]
plain = "Outage minutes per customer in a year"
term = "SAIDI (System Average Interruption Duration Index)"
definition = "The total time a utility's average customer is without power in a year. In 2024 the U.S. average was about 11 hours."
citations = ["eia_861_reliability_2024", "eia_outage_hours_2024"]

[[term]]
plain = "Outages per customer in a year"
term = "SAIFI (System Average Interruption Frequency Index)"
definition = "The average number of outages each of a utility's customers has in a year."
citations = ["eia_861_reliability_2024"]

[[term]]
plain = "Big storm days"
term = "Major event days"
definition = "Days with unusually large outages, such as major storms, which utilities report separately from routine outages."
citations = ["eia_861_reliability_2024", "rr_research_risk_model"]

[[term]]
plain = "Planned power shutoff to prevent wildfires"
term = "Public Safety Power Shutoff (PSPS)"
definition = "When fire danger is high, some utilities turn off power in risky areas so their lines cannot start a fire. Shutoffs often last one to three days (an estimate)."
citations = ["rr_research_risk_model"]

[[term]]
plain = "Your power company's list for medical needs"
term = "Utility medical program (medical baseline, critical care)"
definition = "A program for customers who rely on powered medical equipment. It can bring early warnings of outages and, in some places, a lower rate, but it does not mean your power comes back first."
citations = ["cpuc_medical_baseline", "psegli_critical_care"]

# ---------------------------------------------------------------------------------------------
# Warnings and communication
# ---------------------------------------------------------------------------------------------

[[term]]
plain = "Emergency alerts on your phone"
term = "Wireless Emergency Alerts (WEA)"
definition = "Short alerts that officials send to phones in an area. They are free, and you do not need to sign up."
citations = ["ready_gov_alerts"]

[[term]]
plain = "Weather radio"
term = "NOAA Weather Radio All Hazards"
definition = "A national radio network with more than 1,000 transmitters covering all 50 states. It needs a special receiver, ideally one with a tone alert."
citations = ["nws_weather_radio", "ready_gov_kit"]

[[term]]
plain = "License-free two-way radios"
term = "FRS (Family Radio Service)"
definition = "Walkie-talkie radios anyone can use without a license. They reach less than half a mile on some channels and farther on others."
citations = ["fcc_frs"]

[[term]]
plain = "Licensed family two-way radios"
term = "GMRS (General Mobile Radio Service)"
definition = "Two-way radios that need an FCC license, with a $35 application fee. Any family member may then use the radios, and the range is about 1 to 25 miles."
citations = ["fcc_gmrs", "ecfr_47_1_1102"]

# ---------------------------------------------------------------------------------------------
# Hazards and protective actions
# ---------------------------------------------------------------------------------------------

[[term]]
plain = "High-risk flood zone"
term = "Special Flood Hazard Area (SFHA)"
definition = "Land that FEMA maps as having a 1 in 100 chance of flooding in any year. Flooding can also happen outside these zones."
citations = ["fema_flood_zones", "ready_gov_floods"]

[[term]]
plain = "The wait before flood insurance starts"
term = "NFIP waiting period"
definition = "A new National Flood Insurance Program policy usually takes 30 days to start, so buy it well before a storm."
citations = ["fema_nfip_flood_insurance"]

[[term]]
plain = "Sea water pushed ashore by a storm"
term = "Storm surge"
definition = "Water pushed onto land by a hurricane's winds. It has been the leading cause of hurricane deaths in the United States."
citations = ["ready_gov_hurricanes"]

[[term]]
plain = "Hurricane strength rating"
term = "Saffir-Simpson category"
definition = "Hurricanes are rated from 1 to 5 by wind speed. About one in three hurricanes that reached the U.S. coast since 1851 were category 3 or stronger."
citations = ["noaa_hurdat2"]

[[term]]
plain = "The area that may be told to leave"
term = "Evacuation zone"
definition = "An area officials may order to evacuate, for example near the coast in a hurricane or near a wildfire. Learn yours and your routes before you need them."
citations = ["ready_gov_hurricanes", "ready_gov_wildfires"]

[[term]]
plain = "Staying put and sealing a room"
term = "Shelter in place"
definition = "Staying inside an interior room with few windows, and sealing it with plastic sheeting and duct tape when officials tell you to."
citations = ["ready_gov_shelter"]

[[term]]
plain = "What to do when the ground shakes"
term = "Drop, Cover and Hold On"
definition = "Drop to your hands and knees, cover your head and neck, and hold on until the shaking stops."
citations = ["ready_gov_earthquakes"]

[[term]]
plain = "An air filter that catches smoke"
term = "MERV 13 filter"
definition = "A filter rating for heating and cooling systems. A box fan with a MERV 13 filter makes a low-cost air cleaner for wildfire smoke."
citations = ["epa_diy_air_cleaners", "epa_wildfire_indoor_air"]

[[term]]
plain = "A close-fitting mask that filters the air"
term = "N95 respirator"
definition = "A mask that protects better than cloth or surgical masks when it fits well. Keep some for wildfire smoke, volcanic ash and outbreaks; they are not made to fit children."
citations = ["cdc_masks", "ready_gov_wildfires", "epa_children_wildfire_smoke"]

[[term]]
plain = "Dangerously high body temperature"
term = "Heat stroke"
definition = "A medical emergency. Signs include a body temperature of 103°F or higher, hot, red skin that may be dry or damp, a fast, strong pulse and confusion; call 911 and cool the person with cool cloths while you wait."
citations = ["cdc_heat_related_illness"]

[[term]]
plain = "Chest pushes only, no breaths"
term = "Hands-only CPR"
definition = "Pushing hard and fast in the center of the chest of a teen or adult whose heart has stopped, after calling 911. You do not need training to do it."
citations = ["medlineplus_cpr"]

[[term]]
plain = "A heart defibrillator anyone can use"
term = "AED (automated external defibrillator)"
definition = "A device that can shock a stopped heart back into a normal rhythm. It gives spoken step-by-step instructions, and many public places have one."
citations = ["medlineplus_cpr"]

[[term]]
plain = "Dangerously low body temperature"
term = "Hypothermia"
definition = "A body temperature below 95°F. It is an emergency; warm the center of the body first."
citations = ["ready_gov_winter"]

[[term]]
plain = "The pill that protects the thyroid"
term = "Potassium iodide (KI)"
definition = "A pill that protects only the thyroid from radioactive iodine. Take it only when public health or emergency officials tell you to."
citations = ["cdc_potassium_iodide"]

[[term]]
plain = "The planning area around a nuclear plant"
term = "Emergency planning zone (EPZ)"
definition = "The area within about 10 miles of a nuclear power plant where officials plan for sheltering, evacuation and potassium iodide."
citations = ["nrc_potassium_iodide", "fema_nuclear_sites"]

# ---------------------------------------------------------------------------------------------
# Money, medicine and community
# ---------------------------------------------------------------------------------------------

[[term]]
plain = "Money set aside for surprises"
term = "Emergency fund"
definition = "Savings you can reach quickly for a lost job, a repair or a disaster. Planners often suggest three to six months of living expenses."
citations = ["finra_financial_foundations", "cfpb_emergency_fund"]

[[term]]
plain = "A kit of your key papers"
term = "EFFAK (Emergency Financial First Aid Kit)"
definition = "FEMA's checklist for gathering and protecting the documents, account details and contacts you would need to recover after a disaster."
citations = ["fema_effak"]

[[term]]
plain = "Extra medicine from a pharmacist in an emergency"
term = "Emergency refill law"
definition = "State rules that let pharmacists give extra medicine when you cannot reach your prescriber. They vary: many allow only 72 hours, and some states have none."
citations = ["healthcare_ready_refill_laws"]

[[term]]
plain = "Federal help replacing prescriptions"
term = "EPAP (Emergency Prescription Assistance Program)"
definition = "A federal program that helps people without insurance replace prescriptions, supplies and equipment, in areas where it is turned on after a disaster."
citations = ["hhs_aspr_epap"]

[[term]]
plain = "Neighbourhood disaster training"
term = "CERT (Community Emergency Response Team)"
definition = "Local training in disaster preparedness, fire safety, light search and rescue, team organization and disaster medical care."
citations = ["ready_gov_cert"]

[[term]]
plain = "A bag to take if you have to leave"
term = "Go-bag"
definition = "A bag for each person with the basics: phone, chargers, medicines, ID and cash."
citations = ["cdc_evacuation_psa"]

[[term]]
plain = "A bag for getting home on foot"
term = "Get-home bag"
definition = "A small bag kept at work or in the car with water, food, medicines and comfortable walking shoes."
citations = ["ready_gov_kit_2020"]

[[term]]
plain = "A crisis line for mental health"
term = "988 Suicide and Crisis Lifeline"
definition = "Free, judgment-free support 24 hours a day for mental health, substance use and more. Call, text or chat 988."
citations = ["samhsa_988"]
