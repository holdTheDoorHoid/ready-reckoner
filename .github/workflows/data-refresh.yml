name: Refresh data packs

# Quarterly: re-run the ETL against the federal sources and open a pull request with the new packs
# and provenance manifest. Nothing merges automatically; a human reads data/CHANGES.md and the
# manifest diff. The full run takes about an hour and a half (11.6 GB of EAGLE-I outage data are
# streamed, never stored; the USGS hazard service is called once per county; the karst map,
# 0.28 GB, and EPA's drinking-water archive, 0.42 GB, sit on disk only while they are read).
#
# Default jobs (run order, see `rr-etl jobs`): geography, nri, outages, events, seismic, climate,
# flood, strategic, geomag, ground, levees, water_systems, smoke, facilities, surge_proxy,
# eviction (writes nothing until the owner's sign-off in data/manifest.json), vulnerability,
# base_rates. The optional jobs `surge` (0.25 GB of NHC map archives) and `wildfire_places` build
# optional packs and are not run here; name them in `only` to run them on demand.
# `rr-etl verify` also fails the run if the core pack grows past its 5 MB gzipped budget.
on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated job ids to run (empty runs every default job; optional jobs such as surge and wildfire_places run only when named; see `rr-etl jobs`)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the ETL
        id: etl
        # A failing source keeps its previous pack; the rest still refresh. The outcome is
        # reported in the pull request, and data/CHANGES.md names the failed jobs.
        continue-on-error: true
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            cargo run --release -p rr-etl -- refresh --out data --only "$ONLY"
          else
            cargo run --release -p rr-etl -- refresh --out data
          fi
      - name: Verify checksums, row counts and county joins
        run: cargo run --release -p rr-etl -- verify --data data
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          ETL_OUTCOME: ${{ steps.etl.outcome }}
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."; exit 0
          fi
          branch="data-refresh-$(date -u +%Y-%m-%d)"
          git config user.name "ready-reckoner-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          git add data
          git commit -m "data: quarterly refresh $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --title "Data refresh $(date -u +%Y-%m-%d)" \
            --body "Automated quarterly ETL run (ETL step: ${ETL_OUTCOME}; verify passed). Review data/CHANGES.md for rows changed per pack and data/manifest.json for source versions and dates." \
            --base main --head "$branch"
