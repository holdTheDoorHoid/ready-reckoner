[workspace]
resolver = "3"
members = [
    "crates/rr-types",
    "crates/rr-data",
    "crates/rr-hazards",
    "crates/rr-consequence",
    "crates/rr-supply",
    "crates/rr-budget",
    "crates/rr-content",
    "crates/rr-plan",
    "crates/rr-wasm",
    "crates/rr-cli",
    "crates/rr-etl",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/holdTheDoorHoid/ready-reckoner"
authors = ["Ready Reckoner contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "0.9"

# Debug builds carry line tables only: full debuginfo made each worktree's target dir 7–14 GB on a
# machine several agents share, and tests do not need variable-level debugging. Backtraces keep
# file and line. (2026-09-26)
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
