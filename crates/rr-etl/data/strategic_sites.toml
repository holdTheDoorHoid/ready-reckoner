# strategic_sites.toml -- curated input for the `strategic` ETL job (Ready Reckoner v0.2.0)
#
# Hand-maintained. The `strategic` job (crates/rr-etl/src/jobs/strategic.rs) reads this file, applies the
# class rules below to every county, and writes data/core/strategic.csv (county class, the sites or areas
# behind it, distance, bearing, UASI share) and data/core/strategic_sites.toml (the engine-facing subset:
# classes, sentence templates, included sites, metros, ports, refineries, UASI areas and sources).
#
# Origin: research/strategic_sites.toml and research/strategic-sites.md (research agent r-strategic-sites,
# round 2 phase 2, 2026-09-26). Reviewed 2026-09-26 by the data-hazard agent:
#   - the three missile-field county lists were checked against the Sentinel Final EIS Volume I (read in
#     full: section 2.1.6.1 p. 2-13 F.E. Warren, 2.1.7.1 p. 2-33 Malmstrom, 2.1.8.1 p. 2-40 Minot); all 23
#     counties match, so the county lists now rest on a primary source;
#   - the 44 FY2026 UASI allocations were checked digit by digit against the FEMA FY2026 HSGP NOFO PDF
#     (Appendix I, pp. 71-73; total $584,250,000); all match. The county footprint of each urban area is
#     still a proposal (FEMA does not publish one; each urban area working group sets its own), marked
#     footprint_verified = false;
#   - the NNSA locations page was read in full and confirms the eight enterprise sites and their roles;
#   - the research agent's derived fields (counties_within_30km, counties_touch, first_cut) were removed:
#     the job recomputes them from Census 2020 county centres of population and reports them in the
#     manifest notes.
# Still unverified (kept as flags on the rows): agency pages seen only in search summaries (MDA, NORTHCOM,
# Tinker, Army ERDC, the FEMA Mount Weather notice), roles that rest on FAS 2025 (read through a tool
# summary), secondary coordinates (DOE sites, Raven Rock, Mount Weather, Hill AFB), the principal counties of
# the top-ten ports, and the UASI county footprints.
#
# What this file holds
#   [[class]]      the six strategic-exposure classes, their f_S factors (PRIOR, from hazard-expansion.md B1.4)
#                  and the plain-language "Why here" sentence the app shows for each
#   [geometry.*]   the class rules as data (radii, downwind sector, what distances are measured from)
#   [[site]]       every strategic site with kind, coordinates, counties, class and its sources;
#                  status = "excluded" rows are commonly listed sites that the sources do not support
#   [[metro]]      the 56 metropolitan areas >= 1,000,000 (Census Vintage 2024) with their counties (2023 delineation)
#   [[refinery]], [[port]]   the C2 port and refinery clusters (EIA 2026, BTS 2025)
#   [[uasi]]       FEMA FY2026 UASI allocations and shares (the terrorism metro tier s_UASI)
#   [[source]]     the citation registry for everything above; access = fetched | search_summary | not_retrieved
#
# Rules for editing: one public source per site (primary preferred: DoD MIRTA, service or agency pages, statute,
# EIS; FAS/Bulletin compilations are secondary). A site whose role rests on nothing public stays excluded.
# f_S values are expert priors and must keep the `prior` label and be shown only as ranges. After an edit, run
# `cargo run -p rr-etl -- refresh --out data --only strategic,facilities` (facilities measures ZIP distances
# to the sites) and read the class counts in the manifest notes.

schema = "strategic_sites/1"
status = "reviewed"
prepared = "2026-09-26"
reviewed = "2026-09-26"
precedence = ["A", "C1", "B", "C2", "D", "E"]   # a county takes the qualifying class with the highest f_S
county_point = "population_centre"   # Census 2020 county centres of population; where the Census has none (Connecticut planning regions, island areas) the Gazetteer 2024 internal point in data/core/counties.csv

[[class]]
id = "A"
label = "Counterforce and command sites"
f_s = 0.9
f_s_low = 0.6
f_s_high = 0.99
prior = true
rule = "County contains, or its population centre is within 30 km of: an ICBM launch facility or host base, an SSBN base, a nuclear-capable bomber base, a nuclear-weapons storage site, a primary nuclear command, control and communications (NC3) or continuity-of-government node, or a strategic missile-defence site. Missile fields count by the counties that contain launch facilities."
why_here = "Your county has, or is close to, {site}: {role_plain}. In a large nuclear war, places like this are treated as likely targets. That does not mean an attack is likely. It means that if one happened, this area would face more danger than most."

[[class]]
id = "B"
label = "Missile-field fallout corridor"
f_s = 0.5
f_s_low = 0.2
f_s_high = 0.8
prior = true
rule = "Not A or C1, and the county population centre is within 800 km of a launch-facility county at a compass bearing of 45 to 135 degrees (north-east through south-east, the usual downwind side), or within 75 km in any direction."
why_here = "You live downwind of the nuclear missile fields in {field_states}, about {distance_mi} miles to your {upwind_dir}. Winds here usually blow from the west. If those missile sites were ever attacked, radioactive fallout could drift over your area within a day or two. That is the main reason your chance is higher than in most places."

[[class]]
id = "C1"
label = "Largest cities, the capital region and weapons plants"
f_s = 0.6
f_s_low = 0.3
f_s_high = 0.9
prior = true
rule = "County is in one of the ten largest metropolitan areas (Census Vintage 2024), in the National Capital Region (10 U.S.C. 2674(f)(2)), or contains, or has its population centre within 30 km of, a site of the NNSA nuclear security enterprise."
why_here = "You live in {place}. Because of its size and importance, a place like this is treated as a likely target in a large nuclear war. That does not mean an attack is likely, only that the danger here would be greater than in most places."

[[class]]
id = "C2"
label = "Other large cities, ports, refineries and bases"
f_s = 0.3
f_s_low = 0.1
f_s_high = 0.6
prior = true
rule = "County is in a metropolitan area of 1,000,000 or more (Census Vintage 2024), contains a refinery of 200,000 barrels per calendar day or more (EIA, January 2026), is a principal county of one of the ten busiest ports by tonnage (BTS/USACE 2022), or contains another major military installation listed here."
why_here = "You live in {place}: {reason}. Places like this could be targets in a large nuclear war, but they are less likely targets than the biggest cities and military sites."

[[class]]
id = "D"
label = "Downwind of a target"
f_s = 0.15
f_s_low = 0.05
f_s_high = 0.4
prior = true
rule = "Not A to C2, and the county population centre is within 150 km of an A point site, an NNSA site or a C1 county at a compass bearing of 45 to 135 degrees."
why_here = "You live about {distance_mi} miles downwind of {place}. If that place were attacked, fallout could drift here, so your chance of serious effects is higher than in most rural areas, though still lower than near the target itself."

[[class]]
id = "E"
label = "Remote from targets and fallout paths"
f_s = 0.03
f_s_low = 0.01
f_s_high = 0.1
prior = true
rule = "Everything else."
why_here = "None of the places treated as likely targets, and no missile-field fallout path, is close to you. In a large nuclear war, the main effects here would be shortages, power cuts and lost income, not blast or heavy fallout."

[role_plain]   # fills {role_plain} in the class A and C1 sentences; per-site overrides go in the site row
icbm_field = "a field of underground nuclear missile silos"
icbm_host_base = "the Air Force base that runs a nuclear missile field"
ssbn_base = "the home port of the Navy’s nuclear-missile submarines"
bomber_base = "a base for bombers that can carry nuclear weapons"
weapons_storage = "a place where nuclear weapons are stored"
nc3_node = "a center that commands or talks to U.S. nuclear forces"
doe_weapons_complex = "a plant or laboratory that makes or looks after nuclear weapons"
missile_defense = "a missile-defense site"
capital_region = "the nation’s capital"
mount_weather = "a site where the federal government would keep working in a national emergency"

[template_rules]
distance_mi = "great-circle distance from the county population centre to the nearest triggering site (B: the nearest launch-facility county that satisfies the B rule, not simply the nearest one), rounded to the nearest 10 miles"
upwind_dir = "16-point compass direction from the county to that site (for B, where the missile field lies from you)"
place = "metro title (short form), the National Capital Region, or the site name"
reason = "the qualifying reason in words: a metro area of more than a million people; a major port; a large oil refinery; a major military base"

[geometry.A]
radius_km = 30
measured_from = "each A point site (MIRTA point or agency location) to the county population centre; missile fields by county list"
touch_rule = "a county whose land comes within 30 km of an A point site but whose centre does not is listed in first_cut.touch_A for review"
sources = ["hazard_expansion_b14"]

[geometry.B]
azimuth_from_deg = 45
azimuth_to_deg = 135
distance_km = 800
ring_km = 75
measured_from = "internal point of every county that contains launch facilities (23 counties; proxy for the 450 launch facilities until their coordinates are bundled)"
calibration = "Chosen so that the population share in A or B matches the Princeton study at state level: majority for ND, SD, NE, MN (Princeton: most inhabitants > 1 Gy average), high for KS and IA, low for CO and OK (not named). Montana comes out at 48%, an under-fit on its upwind western side. See strategic-sites.md section 4.2 for the tested variants."
state_share_A_or_B_pct = {MT = 48, ND = 100, SD = 100, NE = 100, MN = 100, IA = 51, KS = 97, WY = 59, CO = 7, WI = 12, MO = 23, OK = 18}
alternative_rule = "NAPB-90 county fallout class High or Very High (Annex B maps). Not applied: the maps are scanned images and were not digitised in this pass."
sources = ["sciam_2023", "missilesonourland", "napb90_exec", "napb90_annexb", "hazard_expansion_b14"]

[geometry.D]
azimuth_from_deg = 45
azimuth_to_deg = 135
distance_km = 150
ring_km = 0
measured_from = "A point sites, NNSA sites and the internal point of every C1 county (missile fields excluded: their downwind side is class B)"
tropical_exception = "Hawaii and Guam lie in the easterly trade winds; if an A or C1 site is ever added there, use 225 to 315 degrees. No such site is in this file."
sources = ["napb90_exec", "hazard_expansion_b14"]

