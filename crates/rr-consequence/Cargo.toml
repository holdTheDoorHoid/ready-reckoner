[package]
name = "rr-consequence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ready Reckoner: hazards to consequence buckets, exceedance curves, targets, ranges and frequency sentences"

[dependencies]
rr-types = { path = "../rr-types" }
# Named scenarios come from rr-hazards (planner decision: use its ScenarioCandidate directly).
rr-hazards = { path = "../rr-hazards" }
serde.workspace = true
thiserror.workspace = true
# The effects table is a TOML data file embedded in the crate and parsed once.
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The backtest's frozen inputs are extracted from the data pack (tests/backtest.rs, `RR_WRITE_BACKTEST=1`).
rr-data = { path = "../rr-data" }
