# v0.2.0: a blackout during a heat wave (rr-hazards' `heat_blackout` scenario on agent/hazards2,
# awaiting: hazards). This is the model's heat-plus-outage compound class (model review M-11): the
# power row carries every dangerous-heat hour (heat_share 1), so an air-conditioned home's heat
# need lasts as long as the power cut, and wells, high-rise pumps, refrigerated medicine and
# public water follow through the usual links. Ordinary power cuts on hot days stay in the
# county's pooled record, with the county's own hot-day share (temperature profile).

[[effect]]
hazard = "heat_wave"
scenario = "heat_blackout"
bucket = "power"
class = "event"
label = "a blackout during a heat wave"
p_given_event = 1.0
duration = { kind = "log_normal", median_days = 2.0, p90_days = 5.0 }
heat_share = 1.0
evidence = "prior"
sources = ["stone_2023_heat_blackout", "rr_risk_model_priors"]
note = "A power cut of a day or more that starts during a heat wave, where there are 60 or more days a year over 95 °F. The length is the design Stone et al. (2023) studied for Phoenix, Atlanta and Detroit: two days dark, then power back over the next three. Air conditioning fails for everyone at once, so the answer is a cool place to go and a way to get there."

[[effect]]
hazard = "heat_wave"
scenario = "heat_blackout"
bucket = "thermal"
class = "event"
label = "a blackout during a heat wave"
p_given_event = 1.0
duration = { kind = "log_normal", median_days = 3.0, p90_days = 7.0 }
requires = "no_cooling"
event_keys = ["heat_wave", "excessive_heat", "heat"]
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Homes without air conditioning face the heat wave itself, as in any heat wave; this one is taken out of the ordinary heat waves, so it is counted once."

[[effect]]
hazard = "heat_wave"
scenario = "heat_blackout"
bucket = "supplies"
class = "event"
label = "a blackout during a heat wave"
p_given_event = 0.5
duration = { kind = "log_normal", median_days = 1.0, p90_days = 3.0 }
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Dark stores and card readers, and heat too dangerous for a long walk."

# ---------------------------------------------------------------------------------------------
# Scenario overlaps. rr-hazards passes each hazard's full rate, which already contains the named
# scenario's long-run share (a Cascadia rupture shakes the county too). When the scenario is
# offered (on or off), that share leaves the parent's typical rows: the parent's rate is scaled by
# 1 − share / rate, never below a quarter (the same floor as the hazard card). The share is the
# scenario's lowest published rate: its long-run alternative when rr-hazards gives one, else its
# rate. Major hurricanes use `replaced_by` rows instead (a class, not a share). The local tsunami
# has no overlap: the county tsunami rows are distant-source tsunamis (NRI's historical record;
# the last Cascadia tsunami was in 1700), and rr-hazards' tsunami card adds the two.
# A blackout during a heat wave is one of the county's heat waves, so it takes its share out of
# them the same way (rr-hazards' heat card does the same).
# ---------------------------------------------------------------------------------------------

[[overlap]]
scenario = "cascadia_m9"
hazard = "earthquake"
note = "The county earthquake rate includes Cascadia's own shaking (0.41 %/yr near Coos Bay, the long-run recurrence)."

[[overlap]]
scenario = "hayward_m7"
hazard = "earthquake"
note = "The Bay Area earthquake rate includes Hayward fault ruptures."

[[overlap]]
scenario = "new_madrid_m7"
hazard = "earthquake"
note = "The county earthquake rate includes New Madrid ruptures."

[[overlap]]
scenario = "wasatch_m7"
hazard = "earthquake"
note = "The Wasatch Front earthquake rate includes Wasatch fault ruptures."

[[overlap]]
scenario = "seattle_fault_m7"
hazard = "earthquake"
note = "The Puget Sound earthquake rate includes Seattle fault ruptures (and Cascadia's, taken out separately)."

[[overlap]]
scenario = "san_andreas_south_m78"
hazard = "earthquake"
note = "The southern California earthquake rate includes southern San Andreas ruptures."

[[overlap]]
scenario = "heat_blackout"
hazard = "heat_wave"
note = "The county's heat-wave rate includes the heat waves that come with a blackout of a day or more."

