# ---------------------------------------------------------------------------------------------
# Parts of a hazard's rate (rows with `part = ...` take the part's rate instead of the whole).
# rr-hazards passes each part's rate (rr_hazards::RatePart); `fallback_share` is used only when a
# caller passes whole rates (the research calibration), and reproduces the earlier fixed split.
# ---------------------------------------------------------------------------------------------

[[part]]
hazard = "wildfire"
part = "burn"
fallback_share = 0.15
label = "wildfire warnings to leave"
note = "rr-hazards: NRI burn probability x residents exposed x 20 households warned per home that burns (model review M-06: these used to be added to the shutoffs and re-split 15/85, which undercounted evacuations 4 to 7 times)."

[[part]]
hazard = "wildfire"
part = "shutoff"
fallback_share = 0.85
label = "wildfire safety power shutoffs"
note = "rr-hazards: 0.02 a year in the western shutoff states (less in cities), none elsewhere."

[[part]]
hazard = "hurricane"
part = "cat12"
fallback_share = 0.94
label = "hurricanes and tropical storms below category 3"
note = "rr-hazards: the county's hurricane rate times the share of HURDAT2 passages below major strength (shrunk toward the pooled 5.4 %), times the category 1-2 footprint. The fallback 0.94 reproduces the fixed split used before the county split was passed (model review M-10)."

[[part]]
hazard = "hurricane"
part = "major"
fallback_share = 0.06
label = "major hurricanes (category 3 or a direct hit)"
note = "rr-hazards: the county's hurricane rate times its share of major passages (HURDAT2, shrunk toward the pooled 5.4 %), times the major-storm footprint; Utuado's is about 17 %, Asheville's about 2 %. Offered as the major-hurricane scenario on the Gulf and Atlantic coasts, which then replaces these rows."

[[part]]
hazard = "landslide"
part = "damage"
fallback_share = 0.1
label = "landslides that damage the home"
note = "rr-hazards: exposed residents x NRI loss ratio / damage ratio 0.3, bounded by NRI's expected annual loss over the county's building value and by 1 in 100 a year (the high-risk flood-zone yardstick); roads cut off are 10 times as many (3 to 30)."

# ---------------------------------------------------------------------------------------------
# Documented public water failures, for the water buckets' "worst event on record" line. The data
# pack's worst-event table covers power only; these are the backtest's water events (docs/
# VALIDATION.md), with the numbers the sources give. A county sees the event for its state.
# ---------------------------------------------------------------------------------------------

