# ---------------------------------------------------------------------------------------------
# Income streams (money bucket `income`, research §3.5). Spell lengths are in WEEKS.
# rate: job_loss uses the household rate from rr-hazards (split evenly between earners); every
# other stream is r_h x per_earner x earners.
# ---------------------------------------------------------------------------------------------

[[income]]
hazard = "job_loss"
label = "losing a job"
per_earner = 1.0
spell_weeks = { kind = "log_normal", median_days = 10.0, p90_days = 36.0 }
unemployment_insurance = true
evidence = "prior"
sources = ["bls_work_experience_2024", "bls_unemployment_duration", "rr_risk_model_priors"]
note = "Spell median 10 weeks, bad case 36 weeks; completed spells are shorter than the 11.4-week median of current spells."

