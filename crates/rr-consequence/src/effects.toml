# Ready Reckoner — effects table: what each hazard does to each consequence bucket, and for how long.
#
# Licence: CC BY-SA 4.0 (a derived table, like everything under content/ and docs/).
# Source of the numbers: docs/research/risk-model.md §2.4 (hazard-to-bucket map), §2.5 (empirical
# durations), §6.2 (societal priors) and §7.5 (the EAGLE-I backtest that revised the power priors),
# plus the research prototype's event classes for Philadelphia and Coos Bay (§8, §9).
#
# How to read a row
#   hazard / scenario  which hazard (or named scenario) the event belongs to
#   class              the event class within the hazard ("local" storm outage, "major" windstorm,
#                      "cat3plus" hurricane). Rows with the same class are the SAME event hitting
#                      several buckets, which is how correlation between buckets is kept.
#   p_given_event      chance that a household-significant event of this hazard is of this class
#                      AND causes this bucket's consequence at the home (0 to 1). Rows of one
#                      (hazard, bucket) are different event classes, so their shares add up to 1 at
#                      most.
#   duration           how long the consequence lasts (median and 90th percentile, in days). For
#                      `evacuate` it is the time away from home; for readiness buckets it is unused.
#   evidence           "empirical" only when both the share and the duration rest on measured
#                      records (or the share is 1 by definition); otherwise "prior" (an expert
#                      estimate, shown to the user as such).
#   duration_evidence  what the duration alone rests on, when it differs from `evidence` (a
#                      measured restoration curve with an expert-estimated share, say).
#   requires           the row applies only to some households: municipal (public water), well,
#                      commuter, no_cooling, no_heating, mobile_home, coastal.
#   pool               a short storm outage: when the county has outage statistics (EAGLE-I), the
#                      county-scale part of these outages comes from them (see the Rust docs).
#   event_keys         county event records (county.events) whose median/p90 days replace the
#                      duration when present.
#   heat_share         share of these power cuts that happen during dangerous heat (air-conditioned
#                      homes then face dangerous heat indoors).
#   cold_share         share that happen when heating is needed (homes whose heating needs power
#                      then face dangerous cold).
#   replaced_by        the row is dropped when this named scenario is offered, because the
#                      scenario carries the same event at its own rate.
#   notice_hours       evacuate rows: least and most warning, in hours.
#   relief             when outside help plausibly arrives and when service is mostly restored for
#                      this event (Oregon Resilience Plan two-tier rating).
#   duration_factor /  uncertainty: the 90th-percentile multiplier on the duration or the share
#   p_factor           (defaults come from [params]).
#
# Hazard rates (how often each hazard reaches the household) are NOT in this file: rr-hazards
# supplies them as HouseholdEventRate. See docs/RISK_MODEL.md, "Consequences and targets".

version = "2026-09-25"

# ---------------------------------------------------------------------------------------------
# Parameters used by the coupling rules, the money buckets and the ranges.
# ---------------------------------------------------------------------------------------------

[params.well_pump_failure]
value = 0.07
low = 0.03
high = 0.15
unit = "failures per year"
duration = { kind = "log_normal", median_days = 2.0, p90_days = 7.0 }
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "A private well's electric pump or pressure tank fails about once in 14 years; repair takes days."

[params.wood_heat_shortfall]
value = 0.01
low = 0.003
high = 0.03
unit = "events per year"
duration = { kind = "log_normal", median_days = 1.0, p90_days = 3.0 }
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "A long winter outage can outrun a wood stove (wet wood, not enough wood cut, nobody able to tend it)."

[params.booster_pump_floor]
value = 7.0
unit = "floor"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Street water pressure usually reaches about six floors; higher floors rely on electric booster pumps (a general rule; check your building)."

[params.cold_onset_days]
value = 0.5
unit = "days"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "A house takes some hours to become dangerously cold after the heating stops."

[params.cold_chain_days]
value = 1.0
unit = "days"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Refrigerated medicine is at risk once the power has been off for about a day, unless there is a cooler plan."

[params.walk_speed_mph]
value = 3.0
unit = "miles per hour"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "An adult walks home at about 3 miles per hour."

[params.walk_water_l_per_hour]
value = 0.5
unit = "litres per hour of walking in heat"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "About half a litre of water per hour of walking in hot weather."

[params.share_hours_away]
value = 0.27
unit = "share of the week"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "A full-time worker spends about 27 percent of the week's hours at work, away from home."

[params.storm_pool_fallback_ratio]
value = 0.33
low = 0.15
high = 0.6
unit = "county-scale outages per short storm outage"
duration = { kind = "log_normal", median_days = 0.0833, p90_days = 0.833 }
evidence = "prior"
sources = ["ornl_eagle_i_outages", "eia_861_reliability_2024", "rr_risk_model_priors"]
note = "Without county outage records, county-scale storm outages are taken as a third of short storm outages, lasting a median of 2 hours with a bad case of 20 hours (the Philadelphia EAGLE-I fit, 0.065 a year against 0.2 short storm outages)."

[params.relief_standard_days]
value = 3.0
unit = "days"
evidence = "prior"
sources = ["oregon_resilience_plan_2013"]
note = "The standard recommendation is to be self-sufficient for 72 hours before major relief arrives."

[params.readiness_threshold]
value = 0.02
unit = "chance in 10 years"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "A readiness capability is worth having once the 10-year chance of needing it reaches 2 in 100."

[params.ui_replacement]
value = 0.5
low = 0.4
high = 0.6
unit = "share of wages"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Unemployment insurance replaces about half of wages (state rules vary)."

[params.ui_weeks]
value = 26.0
unit = "weeks"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Unemployment insurance usually lasts up to 26 weeks (state rules vary)."

[params.job_spell_weeks]
value = 10.0
unit = "weeks (median; p90 in the duration)"
duration = { kind = "log_normal", median_days = 10.0, p90_days = 36.0 }
evidence = "prior"
sources = ["bls_work_experience_2024", "bls_unemployment_duration", "rr_risk_model_priors"]
note = "A completed unemployment spell lasts a median of about 10 weeks, with a bad case of 36 weeks (consistent with 21.5 percent of people with unemployment looking 27 weeks or more). Duration units here are weeks."

[params.weeks_per_month]
value = 4.345
unit = "weeks"
evidence = "empirical"
sources = ["rr_risk_model_priors"]
note = "52.14 weeks divided by 12 months."

[params.job_loss_base_rate]
value = 0.083
low = 0.06
high = 0.11
unit = "spells per earner per year"
evidence = "empirical"
sources = ["bls_work_experience_2024"]
note = "8.3 percent of people who worked or looked for work in 2024 were unemployed at some point. Used only when rr-hazards gives no job-loss rate."

[params.stability_stable]
value = 1.0
low = 0.5
high = 1.0
unit = "times the base job-loss rate"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Regular salary: the typical rate (tenured or public jobs are about half)."

[params.stability_variable]
value = 1.5
low = 1.25
high = 2.0
unit = "times the base job-loss rate"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Commission or variable pay."

[params.stability_seasonal]
value = 1.75
low = 1.5
high = 2.0
unit = "times the base job-loss rate"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Seasonal work."

[params.stability_gig]
value = 2.0
low = 1.5
high = 2.0
unit = "times the base job-loss rate"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Gig or app-based work."

[params.displaced_back_within_week]
value = 0.35
unit = "share of displaced households"
evidence = "empirical"
sources = ["census_pulse_displacement", "aung_2025_displacement"]
note = "More than a third of people displaced by a disaster were back within a week."

[params.displaced_over_six_months]
value = 0.12
unit = "share of displaced households"
evidence = "empirical"
sources = ["census_pulse_displacement"]
note = "12 percent were out for more than six months (not counting those who never returned)."

[params.never_return_renter]
value = 0.25
unit = "share of displaced renters"
evidence = "empirical"
sources = ["census_pulse_displacement"]
note = "About 1 in 4 displaced renters never returned home."

[params.never_return_owner]
value = 0.10
unit = "share of displaced owners"
evidence = "empirical"
sources = ["census_pulse_displacement"]
note = "About 1 in 10 displaced homeowners never returned home."

[params.duration_factor_empirical]
value = 1.3
unit = "90th-percentile multiplier"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Durations measured in records are uncertain by about a factor of 1.3 either way (10th to 90th percentile)."

[params.duration_factor_prior]
value = 2.0
unit = "90th-percentile multiplier"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Expert-estimated durations are uncertain by about a factor of 2 either way."

[params.p_factor_empirical]
value = 1.2
unit = "90th-percentile multiplier"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Measured shares are uncertain by about a factor of 1.2."

[params.p_factor_prior]
value = 1.5
unit = "90th-percentile multiplier"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "Expert-estimated shares are uncertain by about a factor of 1.5."

[params.outage_stats_rate_factor]
value = 1.3
unit = "90th-percentile multiplier"
evidence = "prior"
sources = ["rr_risk_model_priors"]
note = "County outage rates from 2014-2025 records are uncertain by about a factor of 1.3."

