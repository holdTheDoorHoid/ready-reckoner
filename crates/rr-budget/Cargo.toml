[package]
name = "rr-budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ready Reckoner: the value of each purchase, the month-by-month allocator, the savings track and the guardrail warnings"

[dependencies]
# The shared contract. rr-budget deliberately depends on no other engine crate: what it needs from
# rr-supply, rr-content and rr-consequence arrives through the plain input types in `input.rs`, which
# rr-plan fills from the real crates.
rr-types = { path = "../rr-types" }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
