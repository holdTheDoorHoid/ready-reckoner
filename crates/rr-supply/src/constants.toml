unit = "gallon per person-day of such food"
default = 0.6
prior = true
sources = ["rr_expert_prior"]
note = "Worked out from one retail kit's label: about 120 cups of water for 12 person-days of food. Only needed when the food plan uses dehydrated meals."

[[constant]]
key = "water_stored_cap_days"
label = "Days of water to store before a filter and a water source take over"
unit = "day"
default = 14.0
sources = ["byu_longer_term_storage_2019", "ensign_2006_year_supply", "oregon_b2wr_toolkit", "washington_prepare_in_a_year"]
note = "The Church and BYU pair a year of food with two weeks of stored water (14 gallons a person) plus a means of purification. Oregon and Washington ask for two weeks. Beyond that, a filter plus rain, a stream or a pond beats stacking more jugs."

[[constant.alternative]]
label = "Store 2 to 4 weeks (the research example for a well household)"
value = 30.0
sources = ["rr_expert_prior"]

[[constant]]
key = "water_rotation_months"
label = "Replace water you store yourself every"
unit = "month"
default = 6.0
sources = ["cdc_water_storage", "ready_gov_water"]
note = "CDC, Ready.gov, the Church and Washington say every 6 months; the ASPCA says every 2 months for bottled water in a pet kit."
note_sources = ["cdc_water_storage", "ready_gov_water", "church_emergency_prep_manual", "washington_prepare_in_a_year", "aspca_disaster_prep"]

[[constant]]
key = "bleach_drops_per_gal_6pct"
label = "Drops of 6 % unscented bleach per gallon of clear water"
unit = "drop per gallon"
