# ---------------------------------------------------------------------------------------------
# Medication (research §3.2–3.4)
# ---------------------------------------------------------------------------------------------

[[constant]]
key = "rx_days_on_hand"
label = "Days of prescription medicine to keep on hand"
unit = "day"
default = 14.0
low = 7.0
high = 30.0
sources = ["florida_dem_medication", "cdc_diabetes_emergencies", "cdc_pregnancy_emergency", "redcross_survival_kit"]
note = "Red Cross 7 days; CDC 7 to 10 days (pregnancy page) and 1 to 2 weeks of diabetes supplies; Florida 2 weeks. State emergency-refill laws range from 72 hours to 30 days (90 in North Carolina). The plan keeps the household's medication target within 7 to 30 days (14 when there is no target)."
note_sources = ["redcross_survival_kit", "cdc_pregnancy_emergency", "cdc_diabetes_emergencies", "florida_dem_medication", "healthcare_ready_refill_laws"]

[[constant]]
key = "rx_emergency_refill_days"
label = "Longest emergency refill most state disaster rules allow"
unit = "day"
default = 30.0
sources = ["healthcare_ready_refill_laws", "cdc_pregnancy_emergency"]
note = "Ten states allow up to 30 days after a governor's emergency declaration; North Carolina allows 90; 16 jurisdictions have no emergency-refill law. HHS's EPAP helps uninsured people replace prescriptions where it has been switched on after a disaster."
note_sources = ["healthcare_ready_refill_laws", "hhs_aspr_epap"]

[[constant]]
key = "refrigerated_rx_hold_days"
label = "Days refrigerated medicine lasts without power (unless the label says otherwise)"
unit = "day"
default = 1.0
sources = ["ready_gov_power_outages"]

[[constant]]
key = "antibiotic_quantity"
label = "Antibiotics sized by the plan"
unit = "course"
default = 0.0
sources = ["cdc_antibiotic_use", "fda_fish_antibiotics_warning_2023", "fda_expired_medicines", "cdc_yellow_book_travel_kits"]
note = "CDC: don't save antibiotics for later. The Yellow Book allows prescribed standby antibiotics for some remote travel; the Wilderness Medical Society limits routine use to open fractures and some bites; direct-to-consumer kits cost about $300 to $400 and are criticised for stewardship. The plan sizes none and routes to the household's clinician."
note_sources = ["cdc_antibiotic_use", "cdc_yellow_book_travel_kits", "wms_wound_2014", "mo_med_2026_antibiotic_kits"]

