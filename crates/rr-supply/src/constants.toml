unit = "drop per gallon"
default = 6.0
sources = ["epa_emergency_disinfection"]
note = "Ready.gov's older page says 1/8 teaspoon a gallon for 5.25 to 6 % bleach, which is out of date now that 8.25 % bleach is common. CDC says 8 drops for any 5 to 9 % bleach. The plan uses the EPA table by strength, doubled for cloudy water (CDC)."
