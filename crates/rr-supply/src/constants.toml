unit = "litre per animal per day"
default = 25.0
low = 20.0
high = 30.0
sources = ["sphere_2018"]
note = "Sphere: 20 to 30 L per large or medium animal, 5 L per small animal. Horses and cattle often need more in heat; no figure was found."

[[constant]]
key = "water_rehydration_gal_per_person_day"
