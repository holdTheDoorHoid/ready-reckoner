# rr-supply constants registry (CC BY-SA 4.0, like everything under docs/ and content/).
#
# Every number the quantity rules use lives here, with the sources it comes from. The rules read
# values only through this file; `rr_supply::constants()` exposes it for the expert view.
#
# [[constant]]  key        stable snake_case id (the Rust `keys` module names each one)
#               label      what it is, in plain words
#               unit       the unit of `default`, `low`, `high`
#               default    the value the engine uses
#               low, high  optional plausible range (published spread, or the range of an estimate)
#               prior      true when the value is a planning estimate, not a published figure
#               sources    citation ids for the default (they resolve to content/citations.toml)
#               note       optional; where authorities disagree (docs/research/supply-standards.md §13)
#               note_sources  citation ids for numbers in the note
#               [[constant.alternative]]  other published values: label, value, sources
#
# Numbers and wording come from docs/research/supply-standards.md (retrieved 2026-09-25).

# ---------------------------------------------------------------------------------------------
# Water (research §1)
# ---------------------------------------------------------------------------------------------

[[constant]]
key = "water_survival_gal"
label = "Water per person per day at the survival level (drinking only, about 3 L)"
unit = "gallon per person per day"
default = 0.8
low = 0.66
sources = ["sphere_2018", "who_wedc_tn9"]
note = "Drinking only. Sphere and WHO give 2.5 to 3 L a day for drinking in the acute phase of an emergency. Denmark advises 3 L; Germany 2 L for drinking plus cooking."
note_sources = ["sphere_2018", "who_wedc_tn9", "rr_research_supply_standards"]

[[constant]]
key = "water_basic_gal"
label = "Water per person per day at the basic level (drinking and basic hygiene)"
unit = "gallon per person per day"
default = 1.0
sources = ["ready_gov_water", "cdc_water_storage"]
note = "The US figure assumes a short outage and waterless hygiene (wipes, hand sanitizer). Sphere's 15 L and WHO's 20 L are amounts for long emergencies or for good health, not a US household rule."
note_sources = ["sphere_2018", "who_wedc_tn9"]

[[constant.alternative]]
label = "Sphere household minimum (15 L)"
value = 3.96
sources = ["sphere_2018"]

[[constant.alternative]]
label = "WHO minimum for health and hygiene (20 L)"
value = 5.28
sources = ["who_wedc_tn9"]

[[constant]]
key = "water_comfortable_gal"
label = "Water per person per day at the comfortable level (Sphere's 15 L: drinking, cooking and washing)"
unit = "gallon per person per day"
default = 4.0
low = 2.0
high = 5.3
sources = ["sphere_2018"]
note = "Sphere treats 15 L as a floor, not a ceiling; 7.5 L may do for a short time in a drought. WHO puts the minimum for health and hygiene near 20 L."
note_sources = ["sphere_2018", "who_wedc_tn9"]

[[constant]]
key = "water_drinking_share_basic_gal"
label = "Drinking share of the basic allowance"
unit = "gallon per person per day"
default = 0.75
sources = ["ready_gov_water"]
note = "Authorities disagree on how much is for drinking: Washington says at least 1 quart, the Church at least 2 quarts, Ready.gov about 3/4 gallon of fluid, Sphere and WHO 2.5 to 3 L, Germany 2 L for drinking and cooking, Denmark 3 L. The plan keeps 1 gallon in total and shows the range."
note_sources = ["washington_prepare_in_a_year", "church_emergency_prep_manual", "ready_gov_water", "sphere_2018", "who_wedc_tn9", "rr_research_supply_standards"]

[[constant]]
key = "water_heat_drinking_multiplier"
label = "Multiplier on drinking water in a hot climate"
unit = "times"
default = 2.0
sources = ["ready_gov_water", "cdc_water_storage"]
note = "Ready.gov: in very hot temperatures water needs can double. The plan doubles the drinking share (1.75 gallons a person a day at the basic level); the cautious option doubles everything (2 gallons). NIOSH says not to drink more than 6 cups an hour, and the CDC Yellow Book warns against drinking far past thirst."
note_sources = ["ready_gov_water", "cdc_niosh_heat_hydration", "rr_research_supply_standards"]

[[constant]]
key = "hot_climate_days_95f"
label = "Days a year at or above 95 °F that make a county count as hot for water storage"
unit = "days per year"
default = 30.0
low = 10.0
high = 60.0
prior = true
sources = ["rr_expert_prior", "nca5_atlas"]
note = "No agency defines a hot climate for water storage; CDC says to store more if you live in one. The plan uses the hot-weather amount where the county sees about a month or more of 95 °F days a year under the chosen climate dial (Philadelphia today: about 3)."
note_sources = ["cdc_water_storage", "nca5_atlas"]

[[constant]]
key = "water_nursing_add_gal"
label = "Extra water per pregnant or breastfeeding person per day"
unit = "gallon per person per day"
default = 0.29
sources = ["iom_dri_water_2005"]
note = "From the National Academies' total water intakes: 3.8 L a day breastfeeding and 3.0 L pregnant, against 2.7 L for other women (+1.1 L and +0.3 L). The household form has one box for pregnant or nursing, so the plan uses the larger breastfeeding figure."
note_sources = ["iom_dri_water_2005"]

[[constant]]
key = "water_pregnancy_add_gal"
label = "Extra water per pregnant person per day (used if pregnancy is known and nursing is not)"
unit = "gallon per person per day"
default = 0.08
sources = ["iom_dri_water_2005"]

[[constant]]
key = "water_formula_infant_gal"
label = "Safe water to mix powdered formula, per formula-fed baby per day"
unit = "gallon per infant per day"
default = 0.25
sources = ["aap_formula_amounts", "cdc_infant_feeding_disaster"]
note = "About 1 quart (0.95 L) makes the most formula a baby usually drinks in a day (32 oz, AAP). CDC: use ready-to-feed formula if you can; otherwise bottled water, or water boiled for 1 minute and cooled."

