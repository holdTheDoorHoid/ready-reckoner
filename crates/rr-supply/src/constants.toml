city = "Seattle, WA"

# Where authorities disagree on something that is not a single number the rules use
# (research §13). Numeric disagreements are notes on the constants above.
[[disagreement]]
topic = "How long to prepare for"
positions = "Ready.gov: several days (72 hours until about 2021). CDC: 3 days, try 2 weeks. Red Cross: 3 days to leave, 2 weeks at home. Oregon and Washington: 2 weeks. Sweden 1 week, Germany 10 days, the EU and Denmark 72 hours, the Church 3 months plus a longer-term supply."
handling = "The plan sizes each bucket from the household's own risk and says which tier is enough; two weeks is the usual home tier. No authority sets a one-month amount; the one-month tier is an interpolation and the plan says so once."
sources = ["ready_gov_kit", "cdc_water_storage", "redcross_survival_kit", "oregon_2_weeks_ready", "washington_prepare_in_a_year", "church_home_storage_2007"]

[[disagreement]]
topic = "Kerosene heaters"
positions = "CDC lists kerosene heaters as backup heat where local law allows. The International Fire Code, as one fire department states it, bans unvented portable kerosene heaters in living spaces."
handling = "Not suggested by default; shown only as 'if legal where you live, and vented or ventilated'."
sources = ["cdc_winter_safety", "lehi_fuel_storage"]

[[disagreement]]
topic = "Used period products in a bucket toilet"
positions = "RDPO: into the poo bucket. Oregon OEM: a separate garbage bag."
handling = "Follow the local authority; the plan defaults to a separate bag (Oregon) and notes RDPO."
sources = ["rdpo_emergency_toilet", "oregon_b2wr_toolkit"]

[[disagreement]]
topic = "Carbon monoxide deaths"
positions = "CDC's basics page: more than 400 non-fire deaths a year. A CDC PSA page: more than 500."
handling = "Cite more than 400 non-fire deaths a year (CDC)."
sources = ["cdc_co_basics"]

[[disagreement]]
topic = "Church food quantities"
positions = "The 2006 Ensign basics (400 lb grain, 60 lb legumes, 16 lb milk, 10 qt oil, 60 lb sugar, 8 lb salt per adult-year); the 2019 BYU list (about 247 lb of grains plus more variety); official policy since 2007 gives no quantities."
handling = "The BYU 2019 list is the default; the 2006 list is the cheaper option."
sources = ["ensign_2006_year_supply", "byu_longer_term_storage_2019", "church_home_storage_2007"]

