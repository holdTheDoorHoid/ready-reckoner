# December solar output for a 100 W panel (NREL PVWatts v8: fixed, 30 degree tilt, facing south, 14 %
# losses), used as a latitude-band proxy for the household's county. Each band takes the lowest
# measured value at or south of it, so the estimate errs low; inland sites north of 46 degrees do better
# than cloudy Seattle.
[solar]
sources = ["nlr_pvwatts_v8", "rr_expert_prior"]
prior = true
note = "PVWatts assumes ideal aim and no shade; a portable panel laid flat or partly shaded makes less. A 100 to 200 W portable panel keeps phones, lights, a radio and a CPAP going almost everywhere, but not a full-size fridge in a northern winter."

[[solar.row]]
